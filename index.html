<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Anti-Cheat Detector v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e17;--card:#131a2b;--card2:#1a2340;--green:#00e676;--red:#ff5252;--yellow:#ffd740;--blue:#448aff;--cyan:#18ffff;--text:#e0e0e0;--text2:#8892a4;--border:#1e2a42}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;max-width:640px;margin:0 auto}
.hd{text-align:center;padding:20px 0 12px}.hd h1{font-size:20px;font-weight:700;letter-spacing:1px}.hd p{color:var(--text2);font-size:12px;margin-top:4px}

/* 设备画像卡 */
.profile{background:linear-gradient(135deg,#1a2440,#0f1a2e);border:1px solid var(--border);border-radius:14px;padding:20px;margin:12px 0;text-align:center}
.profile-icon{font-size:48px;margin-bottom:8px}
.profile-type{font-size:18px;font-weight:700;margin:4px 0}
.profile-conf{font-size:12px;color:var(--text2)}
.profile-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}
.tag{font-size:11px;padding:3px 10px;border-radius:12px;background:rgba(68,138,255,0.15);color:var(--blue)}
.tag.ok{background:rgba(0,230,118,0.1);color:var(--green)}.tag.bad{background:rgba(255,82,82,0.1);color:var(--red)}.tag.mid{background:rgba(255,215,64,0.1);color:var(--yellow)}

/* 评分 */
.score-wrap{display:flex;justify-content:center;align-items:center;margin:16px auto;position:relative;width:140px;height:140px}
.score-wrap svg{transform:rotate(-90deg)}.bg-c{fill:none;stroke:var(--border);stroke-width:10}.fg-c{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s,stroke .5s}
.score-v{position:absolute;font-size:38px;font-weight:800}.score-l{text-align:center;font-size:13px;color:var(--text2);margin-top:-2px}
.stats{display:flex;justify-content:center;gap:20px;margin:12px 0}.stat{text-align:center}.sn{font-size:20px;font-weight:700}.sl{font-size:10px;color:var(--text2);margin-top:1px}

/* 进度 */
.prog{height:3px;background:var(--border);border-radius:2px;margin:8px 0;overflow:hidden}.prog-f{height:100%;background:var(--blue);border-radius:2px;transition:width .3s;width:0%}

/* 类别 */
.cat{margin:16px 0 6px;padding:0 4px;display:flex;align-items:center;gap:8px}.cat-d{width:7px;height:7px;border-radius:50%;background:var(--blue)}.cat-n{font-size:13px;font-weight:600;color:var(--blue)}

/* 卡片 */
.cd{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;transition:background .2s;margin-bottom:6px}
.cd:hover{background:var(--card2)}.cd-t{display:flex;justify-content:space-between;align-items:center}
.cd-n{font-size:13px;font-weight:500}.cd-b{font-size:10px;padding:2px 8px;border-radius:12px;font-weight:600}
.b-p{background:rgba(0,230,118,.12);color:var(--green)}.b-r{background:rgba(255,82,82,.12);color:var(--red)}
.b-w{background:rgba(255,215,64,.12);color:var(--yellow)}.b-i{background:rgba(24,255,255,.12);color:var(--cyan)}
.b-x{background:rgba(255,255,255,.06);color:var(--text2)}
.cd-s{font-size:11px;color:var(--text2);margin-top:3px}.cd-d{font-size:11px;color:var(--text2);margin-top:6px;display:none;word-break:break-all;line-height:1.5;white-space:pre-wrap}
.cd.open .cd-d{display:block}

.acts{display:flex;gap:8px;margin:20px 0;justify-content:center}
.btn{padding:8px 20px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:12px;cursor:pointer}
.btn:hover{background:var(--card2)}.btn-p{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>
<body>
<div class="hd">
  <h1>Anti-Cheat Detector v2</h1>
  <p>两阶段架构：设备画像 → 针对性风险检测</p>
</div>
<div class="prog"><div class="prog-f" id="prog"></div></div>

<!-- 阶段1: 设备画像 -->
<div class="profile" id="profile" style="display:none">
  <div class="profile-icon" id="pf-icon">📱</div>
  <div class="profile-type" id="pf-type">识别中...</div>
  <div class="profile-conf" id="pf-conf"></div>
  <div class="profile-tags" id="pf-tags"></div>
</div>

<!-- 阶段2: 风险评分 -->
<div class="score-wrap">
  <svg width="140" height="140" viewBox="0 0 140 140">
    <circle class="bg-c" cx="70" cy="70" r="58"/>
    <circle class="fg-c" id="s-arc" cx="70" cy="70" r="58" stroke-dasharray="364.4" stroke-dashoffset="364.4"/>
  </svg>
  <div class="score-v" id="s-val">--</div>
</div>
<div class="score-l" id="s-lbl">检测中...</div>
<div class="stats">
  <div class="stat"><div class="sn" style="color:var(--green)" id="c-pass">0</div><div class="sl">通过</div></div>
  <div class="stat"><div class="sn" style="color:var(--red)" id="c-risk">0</div><div class="sl">风险</div></div>
  <div class="stat"><div class="sn" style="color:var(--cyan)" id="c-info">0</div><div class="sl">信息</div></div>
</div>

<div id="results"></div>
<div class="acts">
  <button class="btn" onclick="location.reload()">重新检测</button>
  <button class="btn btn-p" onclick="exportJSON()">导出 JSON</button>
</div>

<script>
// ==================== 框架 ====================
const checks = [], results = {};
let done = 0, deviceProfile = null;

// status: pass(通过,+分) | risk(风险,-分) | info(信息,不影响分)
function reg(cat, name, fn) { checks.push({ cat, name, fn }); }
function report(name, status, summary, detail) {
  results[name] = { status, summary, detail: detail || {}, ts: Date.now() };
  done++;
  renderCard(name);
  updateScore();
  document.getElementById('prog').style.width = (done / checks.length * 100) + '%';
}

const SL = { pass:'通过', risk:'风险', info:'信息', wait:'...' };
function renderCard(name) {
  const el = document.getElementById('c-' + H(name));
  if (!el) return;
  const r = results[name], b = el.querySelector('.cd-b'), bc = {pass:'b-p',risk:'b-r',info:'b-i'};
  b.className = 'cd-b ' + (bc[r.status]||'b-x'); b.textContent = SL[r.status]||r.status;
  el.querySelector('.cd-s').textContent = r.summary;
  el.querySelector('.cd-d').textContent = typeof r.detail==='object'?JSON.stringify(r.detail,null,2):String(r.detail);
}
function H(n){let h=0;for(let i=0;i<n.length;i++)h=((h<<5)-h+n.charCodeAt(i))|0;return Math.abs(h)}

function updateScore() {
  const v = Object.values(results);
  if (!v.length) return;
  const passC = v.filter(x=>x.status==='pass').length;
  const riskC = v.filter(x=>x.status==='risk').length;
  const infoC = v.filter(x=>x.status==='info').length;
  document.getElementById('c-pass').textContent = passC;
  document.getElementById('c-risk').textContent = riskC;
  document.getElementById('c-info').textContent = infoC;
  // 评分: pass 占比 — 诚实反映检测能力, info 不参与
  const scored = passC + riskC;
  const score = scored === 0 ? 100 : Math.max(0, Math.min(100, Math.round(100 * passC / scored)));
  const arc = document.getElementById('s-arc');
  arc.style.strokeDashoffset = 364.4 * (1 - score / 100);
  arc.style.stroke = score >= 80 ? 'var(--green)' : score >= 50 ? 'var(--yellow)' : 'var(--red)';
  document.getElementById('s-val').textContent = score;
  document.getElementById('s-val').style.color = arc.style.stroke;
  if (done >= checks.length) {
    // 最终判定: 设备画像 + 检测通过率 联合决策
    const profileType = deviceProfile?.type || 'unknown';
    const emuConf = deviceProfile?.scores?.['模拟器'] || 0;
    const cloudConf = deviceProfile?.scores?.['云真机'] || 0;
    const isSafeType = profileType==='iPhone'||profileType==='Android'||profileType==='PC';

    let verdict, verdictColor;
    if (!isSafeType && (emuConf >= 50 || cloudConf >= 50)) {
      // 画像高置信度识别为模拟器/云真机 → 无论通过率多高都标风险
      verdict = `${profileType} (置信度${Math.max(emuConf,cloudConf)}%)`;
      verdictColor = emuConf>=70||cloudConf>=70 ? 'var(--red)' : 'var(--yellow)';
    } else if (score >= 80 && isSafeType) {
      verdict = '设备安全';
      verdictColor = 'var(--green)';
    } else if (score >= 50) {
      verdict = '存在风险';
      verdictColor = 'var(--yellow)';
    } else {
      verdict = '高风险设备';
      verdictColor = 'var(--red)';
    }
    const lbl = document.getElementById('s-lbl');
    lbl.textContent = verdict;
    lbl.style.color = verdictColor;
  }
}

function buildUI() {
  const c = document.getElementById('results'); c.innerHTML = '';
  let last = '';
  checks.forEach(ck => {
    if (ck.cat !== last) { last = ck.cat; c.innerHTML += `<div class="cat"><div class="cat-d"></div><div class="cat-n">${ck.cat}</div></div>`; }
    c.innerHTML += `<div class="cd" id="c-${H(ck.name)}" onclick="this.classList.toggle('open')"><div class="cd-t"><span class="cd-n">${ck.name}</span><span class="cd-b b-x">...</span></div><div class="cd-s" style="color:var(--text2)">检测中</div><div class="cd-d"></div></div>`;
  });
}

function exportJSON() {
  const d = { timestamp: new Date().toISOString(), userAgent: navigator.userAgent, deviceProfile, results };
  const b = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b);
  a.download = 'anticheat-' + Date.now() + '.json'; a.click();
}

// ==================== 阶段1: 设备画像 ====================

function identifyDevice() {
  const ua = navigator.userAgent, pf = navigator.platform;
  const s = { type: 'unknown', confidence: 0, signals: {}, tags: [] };

  // --- 信号采集 ---
  s.signals.ua = ua;
  s.signals.platform = pf;

  // GPU
  const cv = document.createElement('canvas'), gl = cv.getContext('webgl');
  const dbg = gl?.getExtension('WEBGL_debug_renderer_info');
  s.signals.gpu = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : (gl ? gl.getParameter(gl.RENDERER) : '');
  s.signals.gpuVendor = dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : '';

  // API 存在性
  s.signals.hasBattery = !!navigator.getBattery;
  s.signals.hasConnection = !!navigator.connection;
  s.signals.hasAccelerometer = !!window.Accelerometer;
  s.signals.hasDMPermission = typeof window.DeviceMotionEvent !== 'undefined' && typeof window.DeviceMotionEvent.requestPermission === 'function';
  s.signals.hasChrome = !!window.chrome;
  s.signals.maxTouch = navigator.maxTouchPoints || 0;
  s.signals.cores = navigator.hardwareConcurrency || 0;
  s.signals.memory = navigator.deviceMemory || 0;
  s.signals.isAppleGPU = /apple gpu/i.test(s.signals.gpu);
  s.signals.isMobileGPU = /adreno|mali|powervr|apple gpu/i.test(s.signals.gpu);
  s.signals.isDesktopGPU = /nvidia|geforce|radeon|amd|intel.*(iris|uhd|hd)/i.test(s.signals.gpu);
  s.signals.isSoftGPU = /swiftshader|llvmpipe|softpipe|mesa/i.test(s.signals.gpu);

  // --- 分类逻辑 ---
  let pIPhone=0, pAndroid=0, pPC=0, pEmu=0, pCloud=0;

  // iOS 信号
  if (/iphone|ipad|ipod/i.test(ua) || (pf==='MacIntel' && s.signals.maxTouch>1)) pIPhone+=25;
  if (s.signals.hasDMPermission) pIPhone+=30; // iOS 13+ 独有, 不可伪造
  if (s.signals.isAppleGPU) pIPhone+=25;
  if (!s.signals.hasBattery && !s.signals.hasConnection && !s.signals.hasAccelerometer && /iphone|ipad/i.test(ua)) pIPhone+=15;
  if (s.signals.hasChrome && pIPhone>0) pIPhone-=20; // 真 Safari 没有 window.chrome

  // Android 信号
  if (/android/i.test(ua) && /linux arm/i.test(pf)) pAndroid+=25;
  if (s.signals.isMobileGPU && !s.signals.isAppleGPU) pAndroid+=15;
  if (s.signals.hasBattery && s.signals.maxTouch>0 && /android/i.test(ua)) pAndroid+=10;

  // PC 信号
  if (/Win|Mac/.test(pf) && !/android|mobile/i.test(ua) && !(/MacIntel/.test(pf)&&s.signals.maxTouch>1)) pPC+=30;
  if (s.signals.isDesktopGPU) pPC+=20;
  if (s.signals.cores>=8 && s.signals.memory>=8 && !/android|mobile/i.test(ua)) pPC+=10;
  if (/linux/i.test(pf) && !/android/i.test(ua) && !s.signals.isMobileGPU) pPC+=20;

  // 模拟器信号
  if (s.signals.isSoftGPU) pEmu+=35;
  if (/android/i.test(ua) && s.signals.isDesktopGPU) pEmu+=25;
  if (/android/i.test(ua) && /Win/i.test(pf)) pEmu+=30;
  if (s.signals.isMobileGPU && /Win|Mac/.test(pf) && !/MacIntel.*maxTouch/.test('')) pEmu+=15;
  // x86 平台 + Android = 模拟器 (真机 Android 都是 ARM)
  if (/android/i.test(ua) && /i[36]86|x86_64/i.test(pf)) pEmu+=35;
  if (s.signals.isMobileGPU && /i[36]86|x86_64/i.test(pf)) pEmu+=20;
  const chrM = ua.match(/Chrome\/(\d+)/);
  if (chrM && parseInt(chrM[1])<115 && /android/i.test(ua)) pEmu+=15;

  // 云真机信号 (后续阶段2补充)

  // === 硬证据短路: 确定性信号直接判定, 不走加权 ===
  s.hardEvidence = [];

  // x86/x86_64 平台 + Android UA = 100% 模拟器 (没有任何真实手机是 x86)
  if (/android/i.test(ua) && /i[36]86|x86_64/i.test(pf)) {
    s.hardEvidence.push('x86平台运行Android');
    // 细分模拟器品牌
    if (/i686/i.test(pf) && s.signals.cores<=4 && s.signals.memory<=4)
      s.hardEvidence.push('特征匹配:雷电模拟器');
  }

  // 软件渲染 GPU = 100% 虚拟环境
  if (s.signals.isSoftGPU) s.hardEvidence.push('软件渲染GPU(SwiftShader/llvmpipe)');

  // Android UA + Windows/Mac 平台 = 100% 模拟器
  if (/android/i.test(ua) && /Win|Mac/.test(pf) && !(/MacIntel/.test(pf)&&s.signals.maxTouch>1))
    s.hardEvidence.push('Android UA但桌面操作系统');

  // ARM GPU 在 x86 平台 = 翻译层
  if (s.signals.isMobileGPU && !s.signals.isAppleGPU && /i[36]86|x86_64/i.test(pf))
    s.hardEvidence.push('ARM GPU通过x86翻译层运行');

  if (s.hardEvidence.length > 0) {
    // 硬证据存在: 直接判定模拟器 100%
    s.type = '模拟器';
    s.confidence = 100;
    s.scores = {iPhone:0, Android:0, PC:0, '模拟器':100, '云真机':0};
    s.reason = s.hardEvidence.join(' + ');
  } else {
    // 无硬证据: 走加权评分
    const scores = {iPhone:pIPhone, Android:pAndroid, PC:pPC, '模拟器':pEmu, '云真机':pCloud};
    const total = Math.max(1, Object.values(scores).reduce((a,b)=>a+b,0));
    const best = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
    s.type = best[0][1]>0 ? best[0][0] : 'unknown';
    s.confidence = Math.round(best[0][1]/total*100);
    s.scores = {};
    for (const [k,v] of Object.entries(scores)) s.scores[k] = Math.round(v/total*100);
    s.reason = '加权评分';
  }

  // 生成标签
  const gpu = s.signals.gpu;
  if (gpu) s.tags.push(gpu.length>30?gpu.substring(0,30)+'...':gpu);
  s.tags.push(pf);
  if (s.signals.cores) s.tags.push(s.signals.cores+'核');
  if (s.signals.memory) s.tags.push(s.signals.memory+'GB');
  s.tags.push('Touch='+s.signals.maxTouch);

  return s;
}

function renderProfile(p) {
  const el = document.getElementById('profile'); el.style.display='block';
  const icons = {iPhone:'🍎',Android:'🤖',PC:'💻','模拟器':'⚠️','云真机':'☁️',unknown:'❓'};
  document.getElementById('pf-icon').textContent = icons[p.type]||'❓';
  document.getElementById('pf-type').textContent = p.type;
  const confLine = p.hardEvidence?.length
    ? `硬证据: ${p.reason}`
    : `置信度 ${p.confidence}% | ` + Object.entries(p.scores).map(([k,v])=>`${k}${v}%`).join(' ');
  document.getElementById('pf-conf').textContent = confLine;
  const tags = document.getElementById('pf-tags');
  tags.innerHTML = '';
  p.tags.forEach(t => { const sp = document.createElement('span'); sp.className = 'tag'; sp.textContent = t; tags.appendChild(sp); });
}

// ==================== 辅助 ====================
function isType(t){return deviceProfile?.type===t}
function isIOS(){return isType('iPhone')}
function isAndroid(){return isType('Android')}
function isPC(){return isType('PC')}
function isEmu(){return isType('模拟器')}
function isMobile(){return isIOS()||isAndroid()}
function isChromeBrowser(){return /chrome/i.test(navigator.userAgent)&&!/edg|opr|opera/i.test(navigator.userAgent)&&!!window.chrome}

// ==================== 阶段2: 检测项 ====================

// ---- 环境验证 ----

reg('环境验证','WebGL 渲染器',async()=>{
  const gpu=deviceProfile.signals.gpu, vendor=deviceProfile.signals.gpuVendor;
  if(!gpu) return report('WebGL 渲染器','info','WebGL 不可用',null);
  const d={vendor,renderer:gpu};
  if(deviceProfile.signals.isSoftGPU) report('WebGL 渲染器','risk',`软件渲染: ${gpu.substring(0,40)} (模拟器)`,d);
  else if(/virtualbox|vmware|vbox/i.test(gpu)) report('WebGL 渲染器','risk',`虚拟机 GPU: ${gpu.substring(0,40)}`,d);
  else report('WebGL 渲染器','pass',gpu.substring(0,50),d);
});

reg('环境验证','GPU vs 平台一致性',async()=>{
  const gpu=deviceProfile.signals.gpu, pf=navigator.platform, ua=navigator.userAgent;
  const d={gpu:gpu?.substring(0,50),platform:pf};
  const issues=[];
  if(/adreno|mali|powervr/i.test(gpu)&&/Win/i.test(pf)) issues.push('手机GPU在Windows');
  if(/adreno|mali|powervr/i.test(gpu)&&/i[36]86|x86_64|x86/i.test(pf)) issues.push('ARM GPU在x86平台 (模拟器)');
  if(deviceProfile.signals.isDesktopGPU&&/android/i.test(ua)&&!/linux/i.test(pf)) issues.push('桌面GPU声称Android');
  if(isIOS()&&!deviceProfile.signals.isAppleGPU&&gpu) issues.push('声称iOS但非Apple GPU');
  if(/android/i.test(ua)&&/i[36]86|x86_64/i.test(pf)) issues.push('Android UA但x86平台 (模拟器)');
  d.issues=issues;
  if(issues.length) report('GPU vs 平台一致性','risk',issues.join('; '),d);
  else report('GPU vs 平台一致性','pass','GPU 与平台匹配',d);
});

reg('环境验证','电池状态',async()=>{
  if(!navigator.getBattery){
    // iOS/Safari 不支持 Battery API — 符合预期
    if(isIOS()) return report('电池状态','pass','iOS 不提供 Battery API',{expected:true});
    return report('电池状态','info','Battery API 不可用',null);
  }
  const b=await navigator.getBattery();
  const d={level:b.level,charging:b.charging,chargingTime:b.chargingTime,dischargingTime:b.dischargingTime};
  if(isPC()) return report('电池状态','info',`桌面端 ${Math.round(b.level*100)}% (跳过)`,d);
  if(b.level===1&&b.charging&&b.chargingTime===0) report('电池状态','risk','电量100%+永充+chargingTime=0 (模拟器)',d);
  else report('电池状态','pass',`${Math.round(b.level*100)}% ${b.charging?'充电中':'未充电'}`,d);
});

reg('环境验证','传感器',async()=>{
  if(isPC()) return report('传感器','info','桌面端无需传感器 (跳过)',{skip:true});
  if(isIOS()){
    const has=typeof DeviceMotionEvent?.requestPermission==='function';
    return report('传感器',has?'pass':'info',has?'iOS DeviceMotion API 可用':'iOS 传感器需用户授权',{iosPermission:has});
  }
  // Android / 模拟器: 检查 Generic Sensor API
  const r={};let miss=0;
  const ck=(n,C)=>new Promise(rv=>{
    try{
      if(!C){r[n]='不存在';miss++;rv();return}
      const s=new C({frequency:10});let got=false;
      s.addEventListener('reading',()=>{if(!got){got=true;r[n]='可用';s.stop();rv()}});
      s.addEventListener('error',()=>{r[n]='错误';miss++;s.stop();rv()});
      s.start();setTimeout(()=>{if(!got){r[n]='超时';miss++;s.stop();rv()}},1500);
    }catch(e){r[n]='异常';miss++;rv()}
  });
  await Promise.all([ck('加速度计',window.Accelerometer),ck('陀螺仪',window.Gyroscope),ck('磁力计',window.Magnetometer)]);
  if(miss>=3&&isMobile()) report('传感器','risk','移动端无传感器 (模拟器特征)',r);
  else if(miss>=3) report('传感器','info','传感器不可用',r);
  else report('传感器','pass',`${3-miss}/3 可用`,r);
});

reg('环境验证','DeviceMotion',async()=>{
  if(isPC()) return report('DeviceMotion','info','桌面端无需运动传感器 (跳过)',{skip:true});
  if(isIOS()&&typeof DeviceMotionEvent?.requestPermission==='function')
    return report('DeviceMotion','pass','iOS 需用户手势授权 (正常)',{ios:true});
  return new Promise(rv=>{
    let got=false;
    const h=e=>{got=true;window.removeEventListener('devicemotion',h);
      const a=e.accelerationIncludingGravity||{};
      if(a.x===null&&a.y===null&&a.z===null&&isMobile()) report('DeviceMotion','risk','加速度全null (模拟器)',{x:a.x,y:a.y,z:a.z});
      else if(a.x!==null) report('DeviceMotion','pass',`x=${a.x?.toFixed(1)} y=${a.y?.toFixed(1)} z=${a.z?.toFixed(1)}`,{x:a.x,y:a.y,z:a.z});
      else report('DeviceMotion','info','加速度为null',{x:a.x,y:a.y,z:a.z});
      rv();
    };
    window.addEventListener('devicemotion',h);
    setTimeout(()=>{if(!got){window.removeEventListener('devicemotion',h);
      report('DeviceMotion',isMobile()?'risk':'info',isMobile()?'移动端无运动数据 (模拟器)':'无运动数据',null);rv();}},2000);
  });
});

reg('环境验证','硬件信息',async()=>{
  const d={cores:navigator.hardwareConcurrency||0,memory:navigator.deviceMemory||0,
    maxTouch:navigator.maxTouchPoints,platform:navigator.platform};
  let msg=`${d.cores}核`;
  if(d.memory) msg+=` ${d.memory}GB`;
  else if(isIOS()) msg+=' (iOS不暴露内存)';
  msg+=` Touch=${d.maxTouch}`;
  if(d.maxTouch===0&&isAndroid()) report('硬件信息','risk','Android无触摸 (模拟器)',d);
  else report('硬件信息','pass',msg,d);
});

reg('环境验证','屏幕特征',async()=>{
  const d={w:screen.width,h:screen.height,dpr:devicePixelRatio,depth:screen.colorDepth,
    orient:screen.orientation?.type||'unknown'};
  if(d.dpr===1&&d.w>400&&isMobile()&&!isIOS()) report('屏幕特征','info',`DPR=1 宽${d.w}px (移动端少见)`,d);
  else report('屏幕特征','pass',`${d.w}x${d.h} DPR=${d.dpr} ${d.depth}bit`,d);
});

reg('环境验证','媒体设备',async()=>{
  try{
    if(!navigator.mediaDevices?.enumerateDevices) return report('媒体设备','info','API 不可用',null);
    const devs=await navigator.mediaDevices.enumerateDevices();
    const cam=devs.filter(d=>d.kind==='videoinput').length;
    const mic=devs.filter(d=>d.kind==='audioinput').length;
    const d={cameras:cam,microphones:mic};
    if(cam===0&&mic===0&&isMobile()) report('媒体设备','risk','移动端无摄像头/麦克风',d);
    else report('媒体设备','pass',`摄像头${cam} 麦克风${mic}`,d);
  }catch(e){report('媒体设备','info','枚举失败',e.message)}
});

reg('指纹采集','Canvas 指纹',async()=>{
  const c=document.createElement('canvas');c.width=280;c.height=60;const x=c.getContext('2d');
  x.fillStyle='#f60';x.fillRect(10,1,62,20);x.fillStyle='#069';x.font='14px Arial';
  x.fillText('ACD Fingerprint! 🎮',2,45);x.fillStyle='rgba(102,204,0,.7)';x.fillText('Canvas FP',4,17);
  const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(c.toDataURL()));
  const fp=Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('').substring(0,32);
  report('Canvas 指纹','info',`${fp} (采集)`,{hash:fp});
});

reg('指纹采集','AudioContext 指纹',async()=>{
  try{
    const ac=new(window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,44100,44100);
    const osc=ac.createOscillator();osc.type='triangle';osc.frequency.setValueAtTime(10000,ac.currentTime);
    const comp=ac.createDynamicsCompressor();
    ['threshold','knee','ratio','attack','release'].forEach((p,i)=>comp[p]?.setValueAtTime([-50,40,12,0,.25][i],ac.currentTime));
    osc.connect(comp);comp.connect(ac.destination);osc.start(0);
    const buf=await ac.startRendering();const data=buf.getChannelData(0);
    let sum=0;for(let i=4500;i<5000;i++)sum+=Math.abs(data[i]);
    report('AudioContext 指纹','info','Hash: '+sum.toFixed(8)+' (采集)',{fp:sum.toFixed(10)});
  }catch(e){report('AudioContext 指纹','info','不可用',e.message)}
});

reg('指纹采集','字体指纹',async()=>{
  const fonts=['Arial','Verdana','Times New Roman','Courier New','Georgia','Comic Sans MS','Impact',
    'Microsoft YaHei','SimHei','SimSun','Segoe UI','Calibri','Consolas','Roboto','Droid Sans',
    'Noto Sans CJK','Helvetica Neue','PingFang SC','Ubuntu','DejaVu Sans','Liberation Sans',
    'Menlo','Monaco','SF Pro','Hiragino Sans'];
  const cv=document.createElement('canvas'),ctx=cv.getContext('2d');
  const base='monospace',str='mmMwWLl10!@中文';ctx.font=`72px ${base}`;const bw=ctx.measureText(str).width;
  const avail=[];
  for(const f of fonts){ctx.font=`72px "${f}",${base}`;if(ctx.measureText(str).width!==bw)avail.push(f)}
  const d={total:fonts.length,available:avail.length,list:avail};
  if(avail.length<=3) report('字体指纹','risk',`仅${avail.length}字体 (Headless?)`,d);
  else report('字体指纹','pass',`${avail.length}/${fonts.length} 字体`,d);
});

reg('指纹采集','UA/Platform 一致性',async()=>{
  const ua=navigator.userAgent,pf=navigator.platform,d={ua:ua.substring(0,80),platform:pf};
  const issues=[];
  if(/android/i.test(ua)&&!/linux/i.test(pf)) issues.push('UA=Android platform≠Linux');
  if(/iphone/i.test(ua)&&!/iPhone/i.test(pf)&&pf!=='MacIntel') issues.push('UA=iPhone platform异常');
  if(/Win/.test(pf)&&/Mobile|Android/i.test(ua)) issues.push('桌面platform+移动UA');
  if(issues.length) report('UA/Platform 一致性','risk',issues.join('; '),d);
  else report('UA/Platform 一致性','pass',`${pf}`,d);
});

  });
});

reg('工具检测','端口扫描 (WPK)',async()=>{
  const scan=p=>new Promise(rv=>{try{const ws=new WebSocket(`ws://127.0.0.1:${p}`);
    const t=setTimeout(()=>{ws.close();rv(false)},1200);ws.onopen=()=>{clearTimeout(t);ws.close();rv(true)};
    ws.onerror=()=>{clearTimeout(t);rv(false)}}catch(e){rv(false)}});
  const ports=[7125,7126,27042,27043,5555,9222,8080,8888];
  const open=[];for(const p of ports)if(await scan(p))open.push(p);
  const d={scanned:ports,open};
  const frida=open.some(p=>[27042,27043].includes(p));
  const wpk=open.some(p=>[7125,7126].includes(p));
  if(frida) report('端口扫描 (WPK)','risk',`Frida 端口: ${open.join(',')}`,d);
  else if(wpk) report('端口扫描 (WPK)','risk',`WPK 代理端口: ${open.join(',')}`,d);
  else if(open.length) report('端口扫描 (WPK)','info',`开放: ${open.join(',')}`,d);
  else report('端口扫描 (WPK)','pass',`${ports.length}端口均关闭`,d);
});

reg('工具检测','Headless 深度检测',async()=>{
  const d={},issues=[];
  // chrome 对象结构
  if(!window.chrome&&isChromeBrowser()) issues.push('无window.chrome');
  // Permissions 异常
  try{const np=await navigator.permissions.query({name:'notifications'});d.notifPerm=np.state;
    if(np.state==='denied'&&Notification.permission==='default') issues.push('Permissions矛盾')}catch(e){}
  // rtt=0
  if(navigator.connection?.rtt===0) issues.push('rtt=0');
  // outerWidth=0
  if(window.outerWidth===0&&window.outerHeight===0) issues.push('outer=0');
  d.issues=issues;
  if(issues.length>=2) report('Headless 深度检测','risk',issues.join('; '),d);
  else if(issues.length) report('Headless 深度检测','info',issues[0],d);
  else report('Headless 深度检测','pass','正常',d);
});

reg('工具检测','DevTools 检测',async()=>{

  console.log('%c',el);console.clear();d.devtools=open;d.sizeHint=wd>160||hd>160;

reg('工具检测','浏览器版本',async()=>{
  const ua=navigator.userAgent;
  // 只对 Chrome 内核检查版本, 其他浏览器不适用
  const m=ua.match(/Chrome\/(\d+)/);
  if(!m) return report('浏览器版本','pass','非 Chrome 内核',{ua:ua.substring(0,60)});
  // 非 Chrome 浏览器 (Edge/Opera/Brave 等) 共享 Chrome 版本号但不代表过时
  if(!isChromeBrowser()) return report('浏览器版本','pass',`Chromium ${m[1]} (非Chrome)`,{ver:parseInt(m[1])});
  const ver=parseInt(m[1]);
  // Android + 旧 Chrome 是强烈的模拟器信号 (MuMu 常用 Chrome 110)
  if(ver<115&&isAndroid()) report('浏览器版本','risk',`Android Chrome ${ver} 严重过时 (模拟器特征)`,{ver});
  else if(ver<115) report('浏览器版本','risk',`Chrome ${ver} 严重过时`,{ver});
  else if(ver<135) report('浏览器版本','info',`Chrome ${ver}`,{ver});
  else report('浏览器版本','pass',`Chrome ${ver}`,{ver});
});

// ---- 完整性 ----

reg('完整性','原生函数',async()=>{
  const fns={'fetch':window.fetch,'XHR.open':XMLHttpRequest.prototype.open,
    'console.log':console.log,'addEventListener':EventTarget.prototype.addEventListener,
    'setTimeout':window.setTimeout,'JSON.stringify':JSON.stringify,'JSON.parse':JSON.parse,'WebSocket':window.WebSocket};
  const bad=[];
  for(const[n,f]of Object.entries(fns)){if(!f)continue;
    try{if(!/\[native code\]/.test(Function.prototype.toString.call(f)))bad.push(n)}catch(e){}}
  if(bad.length>=2) report('原生函数','risk',`${bad.length}个被篡改: ${bad.join(',')}`,{bad});
  else if(bad.length) report('原生函数','info',`${bad[0]} 被篡改 (可能是扩展)`,{bad});
  else report('原生函数','pass',`${Object.keys(fns).length}个完整`,{});
});

reg('完整性','Console 劫持',async()=>{

  else if(bad.length) report('Console 劫持','info',`${bad.join(',')} 被覆写`,{bad});

});

reg('行为分析','WebView 检测',async()=>{
  const ua=navigator.userAgent,d={};
  d.iosUAWebView=/AppleWebKit/i.test(ua)&&/Mobile/i.test(ua)&&!/Safari/i.test(ua);
  d.iosInjected=!!(window.webkit?.messageHandlers);
  d.androidWV=/;\s*wv\b/i.test(ua)||/webview/i.test(ua);
  d.androidInjected=!!(window.android||window.AndroidInterface||window.JSBridge||window.ReactNativeWebView||window.Flutter_inappwebview);
  d.chromeWebView=!!(window.chrome?.webview);
  const hits=Object.entries(d).filter(([,v])=>v).map(([k])=>k);
  if(hits.length>=2) report('WebView 检测','risk',`WebView: ${hits.join(',')}`,d);
  else if(hits.length) report('WebView 检测','info',hits[0],d);
  else report('WebView 检测','pass','非 WebView',d);

reg('行为分析','属性一致性 (Lie Detection)',async()=>{
  const ua=navigator.userAgent,pf=navigator.platform,lies=[];
  if(/android/i.test(ua)&&/Win/i.test(pf)) lies.push('UA=Android+platform=Win');
  if(/x86_64|x86|Win64/i.test(ua)&&/arm/i.test(pf)) lies.push('UA=x86+platform=ARM');
  const mem=navigator.deviceMemory,cores=navigator.hardwareConcurrency;
  if(mem&&cores){if(mem>=8&&cores<=1)lies.push(`${mem}GB内存但${cores}核`)}
  if(navigator.languages?.length&&!navigator.languages.includes(navigator.language)) lies.push('language不在languages中');
  if(lies.length>=2) report('属性一致性 (Lie Detection)','risk',lies.join('; '),{lies});
  else if(lies.length) report('属性一致性 (Lie Detection)','risk',lies[0],{lies});
  else report('属性一致性 (Lie Detection)','pass','无矛盾',{});
});

reg('行为分析','FP/FCP/LCP',async()=>{
  return new Promise(rv=>{
    const d={fp:null,fcp:null,lcp:null};
    const pe=performance.getEntriesByType('paint');
    pe.forEach(e=>{if(e.name==='first-paint')d.fp=Math.round(e.startTime);if(e.name==='first-contentful-paint')d.fcp=Math.round(e.startTime)});
    try{const obs=new PerformanceObserver(l=>{const es=l.getEntries();if(es.length)d.lcp=Math.round(es[es.length-1].startTime)});
      obs.observe({type:'largest-contentful-paint',buffered:true});
      setTimeout(()=>{obs.disconnect();report('FP/FCP/LCP','pass',`FP=${d.fp} FCP=${d.fcp} LCP=${d.lcp}ms`,d);rv()},1500)}
    catch(e){report('FP/FCP/LCP','pass',`FP=${d.fp} FCP=${d.fcp}ms`,d);rv()}
  });
});

// ---- 深度指纹 (真实检测能力, 不靠调分) ----

reg('深度指纹','Math 精度指纹',async()=>{
  // ARM 和 x86 的浮点运算结果在最后几位有差异
  // 来源: CreepJS — 通过 Math 函数结果区分真实架构
  const tests={
    acos:Math.acos(0.123456789),atan:Math.atan(2),atan2:Math.atan2(1,2),
    sin:Math.sin(1),cos:Math.cos(1),tan:Math.tan(1),
    exp:Math.exp(1),log:Math.log(2),sqrt:Math.sqrt(2),
    sinh:Math.sinh(1),cosh:Math.cosh(1),tanh:Math.tanh(1),
    expm1:Math.expm1(1),log1p:Math.log1p(1),cbrt:Math.cbrt(2)
  };
  const fp=JSON.stringify(tests);
  const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(fp));
  const h=Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('').substring(0,16);
  // 关键: 声称 ARM 平台但 Math 结果与 x86 一致 = 翻译层模拟器
  const pf=navigator.platform;
  const d={hash:h,platform:pf,sample_sin:tests.sin,sample_exp:tests.exp};
  // x86 模拟器通过翻译层跑 ARM 代码, Math 精度通常与 x86 native 不同
  // 这里只采集指纹上报, 因为没有标准"ARM Math值"可对比
  report('Math 精度指纹','info',`Hash: ${h} (采集,无基线对比)`,d);
});

reg('深度指纹','WebGL 渲染指纹',async()=>{
  // 不同 GPU 渲染同一内容的像素结果不同 — 真 GPU vs 模拟 GPU
  const cv=document.createElement('canvas');cv.width=64;cv.height=64;
  const gl=cv.getContext('webgl');
  if(!gl) return report('WebGL 渲染指纹','info','WebGL 不可用',null);
  // 绘制一个有梯度和混合的三角形
  const vs=gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs,'attribute vec2 p;varying vec2 v;void main(){v=p;gl_Position=vec4(p,0,1);}');gl.compileShader(vs);
  const fs=gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs,'precision mediump float;varying vec2 v;void main(){gl_FragColor=vec4(v.x*0.5+0.5,v.y*0.5+0.5,sin(v.x*3.14),1);}');gl.compileShader(fs);
  const pg=gl.createProgram();gl.attachShader(pg,vs);gl.attachShader(pg,fs);gl.linkProgram(pg);gl.useProgram(pg);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,0,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pg,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  gl.drawArrays(gl.TRIANGLES,0,3);
  const px=new Uint8Array(64*64*4);gl.readPixels(0,0,64,64,gl.RGBA,gl.UNSIGNED_BYTE,px);
  const hash=await crypto.subtle.digest('SHA-256',px);
  const h=Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('').substring(0,32);
  report('WebGL 渲染指纹','info',`${h} (采集,无基线对比)`,{hash:h});
});

reg('深度指纹','AudioContext 延迟',async()=>{
  try{
    const ac=new AudioContext();
    const d={baseLatency:ac.baseLatency,outputLatency:ac.outputLatency,sampleRate:ac.sampleRate,state:ac.state};
    ac.close();
    // baseLatency=0 可能表示虚拟音频设备
    if(d.baseLatency===0&&isMobile()) report('AudioContext 延迟','risk','baseLatency=0 (虚拟音频)',d);
    else report('AudioContext 延迟','pass',`延迟${(d.baseLatency*1000).toFixed(1)}ms 采样率${d.sampleRate}`,d);
  }catch(e){report('AudioContext 延迟','info','不可用',e.message)}
});

reg('深度指纹','屏幕物理尺寸',async()=>{
  const w=screen.width,h=screen.height,dpr=devicePixelRatio;
  // 物理像素 = CSS像素 × DPR
  const pw=w*dpr, ph=h*dpr;
  const physDiag=Math.sqrt(pw*pw+ph*ph);
  // 估算 PPI: 手机通常 350-500, 桌面 90-150
  const estPPI=isMobile()?420:110;
  const diagInch=physDiag/estPPI;
  const d={width:w,height:h,dpr,physPx:`${Math.round(pw)}x${Math.round(ph)}`,diagInch:diagInch.toFixed(1),estPPI};
  // 手机: 4-7.5寸正常, <3或>10寸异常; 桌面: 10-35寸正常
  if(isMobile()&&(diagInch<3||diagInch>10)) report('屏幕物理尺寸','info',`~${diagInch.toFixed(1)}寸 (估算, PPI假设${estPPI})`,d);
  else report('屏幕物理尺寸','pass',`~${diagInch.toFixed(1)}寸 ${Math.round(pw)}x${Math.round(ph)}px`,d);
});

reg('深度指纹','Vibration API',async()=>{
  // 真实手机有振动器, 模拟器通常没有
  const d={};
  if(!navigator.vibrate) {
    if(isMobile()) report('Vibration API','risk','移动端无振动 API',d);
    else report('Vibration API','pass','桌面端无需振动',d);
    return;
  }
  // 尝试触发微振动 (1ms, 用户感知不到)
  try{const ok=navigator.vibrate(1);d.result=ok;
    report('Vibration API','pass',`vibrate(1)=${ok}`,d)}
  catch(e){report('Vibration API','info','调用异常',e.message)}
});

reg('深度指纹','Performance 计时',async()=>{
  // 执行一段密集计算, 模拟器的 ARM 翻译层通常更慢
  const iterations=500000;
  const t0=performance.now();
  let x=0;for(let i=0;i<iterations;i++)x+=Math.sin(i)*Math.cos(i);
  const elapsed=performance.now()-t0;
  const d={iterations,elapsedMs:elapsed.toFixed(2),opsPerMs:Math.round(iterations/elapsed),dummy:x};
  // 纯粹采集, 不做风险判定 (不同设备性能差异大)
  report('Performance 计时','info',`${elapsed.toFixed(0)}ms / ${(iterations/1000)}K ops (采集)`,d);
});

reg('深度指纹','平台架构验证',async()=>{
  // navigator.platform + UA + GPU 三方交叉
  const pf=navigator.platform, ua=navigator.userAgent, gpu=deviceProfile.signals.gpu||'';
  const d={platform:pf,uaAndroid:/android/i.test(ua),gpu:gpu.substring(0,40)};
  const issues=[];

  // x86 Android = 模拟器 (所有真实 Android 手机都是 ARM)
  if(/android/i.test(ua) && /i[36]86|x86_64/i.test(pf))
    issues.push('x86 平台运行 Android');

  // ARM GPU 在 x86 = 翻译层
  if(/adreno|mali|powervr/i.test(gpu) && /i[36]86|x86_64/i.test(pf))
    issues.push('ARM GPU 在 x86 (翻译层)');

  // Android UA 但 Windows/Mac 平台
  if(/android/i.test(ua) && /Win|Mac/.test(pf))
    issues.push('Android UA 但桌面平台');

  d.issues=issues;
  if(issues.length) report('平台架构验证','risk',issues.join('; '),d);
  else report('平台架构验证','pass',`${pf} | GPU 匹配`,d);
});

reg('深度指纹','WebGL 扩展数量',async()=>{
  const cv=document.createElement('canvas'),gl=cv.getContext('webgl');
  if(!gl) return report('WebGL 扩展数量','info','不可用',null);
  const exts=gl.getSupportedExtensions()||[];
  const d={count:exts.length,list:exts};
  // 真机 GPU 通常 20+ 扩展, 软件渲染 <10
  if(exts.length<8&&isMobile()) report('WebGL 扩展数量','risk',`仅 ${exts.length} 扩展 (软件渲染?)`,d);
  else report('WebGL 扩展数量','pass',`${exts.length} 扩展`,d);
});

reg('深度指纹','时间源精度',async()=>{
  // 测量 Date.now() 和 performance.now() 的精度差异
  // 模拟器和 Headless 的时间源行为不同
  const samples=[];
  for(let i=0;i<50;i++){const a=performance.now(),b=performance.now();if(b>a)samples.push(b-a)}
  const d={sampleCount:samples.length};
  if(samples.length===0){
    d.precision='无差异样本';
    // 移动端浏览器为防 Spectre 降低精度是正常安全措施, 不是异常
    report('时间源精度','pass','精度已被浏览器安全策略限制 (正常)',d);
  }else{
    const min=Math.min(...samples),avg=samples.reduce((a,b)=>a+b,0)/samples.length;
    d.minDelta=min.toFixed(6);d.avgDelta=avg.toFixed(6);
    report('时间源精度','pass',`精度 ${min.toFixed(3)}ms`,d);
  }
});

// ---- 综合判定 ----

reg('综合判定','设备类型概率',async()=>{
  await new Promise(r=>setTimeout(r,500));
  const p=deviceProfile;
  const best=Object.entries(p.scores).sort((a,b)=>b[1]-a[1]);
  const summary=best.filter(([,v])=>v>0).map(([k,v])=>`${k} ${v}%`).join(' | ');
  const top=best[0];
  const safe=top[0]==='iPhone'||top[0]==='Android'||top[0]==='PC';
  report('设备类型概率',safe&&top[1]>=50?'pass':'risk',summary,p.scores);
});

reg('综合判定','云真机判定',async()=>{
  await new Promise(r=>setTimeout(r,500));
  const signals=[];
  if(results['电池状态']?.status==='risk') signals.push('电池异常');
  if(results['数据中心 IP']?.status==='risk') signals.push('数据中心IP');
  if(results['媒体设备']?.status==='risk') signals.push('无媒体设备');
  if(results['传感器']?.status==='risk') signals.push('无传感器');
  if(results['DeviceMotion']?.status==='risk') signals.push('无运动数据');
  const d={signals,count:signals.length};
  if(signals.length>=3) report('云真机判定','risk',`${signals.length}/5: ${signals.join('+')}`,d);
  else if(signals.length>=2) report('云真机判定','info',`${signals.length}/5 信号`,d);
  else report('云真机判定','pass',`${signals.length}/5 信号`,d);
});

// ==================== 启动 ====================
async function run(){
  done=0;Object.keys(results).forEach(k=>delete results[k]);
  document.getElementById('prog').style.width='0%';
  document.getElementById('s-val').textContent='--';
  document.getElementById('s-lbl').textContent='设备识别中...';
  document.getElementById('s-arc').style.strokeDashoffset=364.4;

  // 阶段1: 设备画像
  deviceProfile=identifyDevice();
  renderProfile(deviceProfile);

  // 阶段2: 针对性检测
  buildUI();
  for(const c of checks){try{await c.fn()}catch(e){report(c.name,'info','异常: '+e.message,e.stack)}}
}
run();
</script>
