<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anti-Cheat Detector v2</title>
<style>
:root {
  --accent: #5E5CE6;
  --red:#FF453A; --orange:#FF9F0A; --green:#30D158; --blue:#0A84FF; --info:#64D2FF;
}
[data-theme="dark"]{
  --bg-0:#000; --bg-1:#0a0a0f; --bg-2:#1c1c1e;
  --txt-1:#fff; --txt-2:rgba(235,235,245,0.78); --txt-3:rgba(235,235,245,0.50); --txt-4:rgba(235,235,245,0.30);
  --sep:rgba(84,84,88,0.45);
  --glass-bg:rgba(28,28,30,0.68);
  --glass-stroke:rgba(255,255,255,0.08);
  --glass-shine:rgba(255,255,255,0.06);
  --tint-red:rgba(255,69,58,0.18); --tint-orange:rgba(255,159,10,0.16);
  --tint-green:rgba(48,209,88,0.16); --tint-blue:rgba(10,132,255,0.16);
  --tint-info:rgba(100,210,255,0.16); --tint-accent:rgba(94,92,230,0.20);
  --ambient: radial-gradient(60% 40% at 50% 0%, rgba(94,92,230,0.30), transparent 70%),
             radial-gradient(70% 50% at 20% 90%, rgba(255,69,58,0.22), transparent 70%),
             radial-gradient(70% 50% at 100% 60%, rgba(10,132,255,0.18), transparent 70%);
}
[data-theme="light"]{
  --bg-0:#F2F2F7; --bg-1:#fff; --bg-2:#fff;
  --txt-1:#000; --txt-2:rgba(60,60,67,0.85); --txt-3:rgba(60,60,67,0.60); --txt-4:rgba(60,60,67,0.30);
  --sep:rgba(60,60,67,0.18);
  --glass-bg:rgba(255,255,255,0.74);
  --glass-stroke:rgba(0,0,0,0.06);
  --glass-shine:rgba(255,255,255,0.6);
  --tint-red:rgba(255,59,48,0.10); --tint-orange:rgba(255,149,0,0.10);
  --tint-green:rgba(52,199,89,0.10); --tint-blue:rgba(0,122,255,0.10);
  --tint-info:rgba(90,200,250,0.12); --tint-accent:rgba(94,92,230,0.10);
  --ambient: radial-gradient(60% 40% at 50% 0%, rgba(94,92,230,0.16), transparent 70%),
             radial-gradient(70% 50% at 20% 90%, rgba(255,59,48,0.12), transparent 70%),
             radial-gradient(70% 50% at 100% 60%, rgba(0,122,255,0.10), transparent 70%);
}

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; padding:0; }
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  background:var(--bg-0); color:var(--txt-1);
  min-height:100vh; letter-spacing:-0.01em;
}
body::before{content:"";position:fixed;inset:0;background:var(--ambient);pointer-events:none;z-index:0;transition:background .4s ease;}
.tabular{font-variant-numeric:tabular-nums;}

/* ─── Dynamic Island ─── */
.island-area{
  position:sticky; top:0; z-index:30;
  padding:14px 16px 12px;
  display:flex; flex-direction:column; align-items:center;
  background:linear-gradient(to bottom, var(--bg-0) 50%, transparent);
}
.island{
  display:flex; align-items:center; gap:10px;
  background:rgba(20,20,22,0.55);
  color:#fff;
  border-radius:999px;
  padding:10px 18px 10px 14px;
  height:44px; min-width:240px;
  box-shadow:
    inset 0 0.6px 0 rgba(255,255,255,0.14),
    inset 0 -0.6px 0 rgba(0,0,0,0.45),
    0 12px 36px rgba(0,0,0,0.55),
    0 0 0 0.5px rgba(255,255,255,0.06);
  position:relative; overflow:hidden;
  cursor:pointer; user-select:none;
  transition:all .4s cubic-bezier(.2,.8,.2,1);
  backdrop-filter:blur(28px) saturate(200%);
  -webkit-backdrop-filter:blur(28px) saturate(200%);
}
[data-theme="light"] .island{
  background:rgba(20,20,22,0.85);
  box-shadow:
    inset 0 0.6px 0 rgba(255,255,255,0.14),
    0 12px 36px rgba(0,0,0,0.28);
}
.island::before{
  content:""; position:absolute; inset:0; border-radius:999px;
  background:
    radial-gradient(60% 100% at 30% 0%, rgba(255,255,255,0.10), transparent 60%),
    linear-gradient(180deg, rgba(255,255,255,0.06), transparent 50%);
  pointer-events:none;
}
.island::after{
  content:""; position:absolute;
  top:0; bottom:0; width:60%; left:-60%;
  background:linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.16) 50%, transparent 70%);
  animation:shimmer 3.4s ease-in-out 1 forwards;
  pointer-events:none;
  mix-blend-mode:overlay;
}
@keyframes shimmer{
  0%, 25%{ transform:translateX(0); }
  60%, 100%{ transform:translateX(260%); }
}
.island-dot{
  width:10px; height:10px; border-radius:50%;
  background:var(--orange); flex-shrink:0;
  box-shadow:0 0 0 0 rgba(255,159,10,0.7);
  animation:pulse 1.6s ease-out 1 forwards;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(255,159,10,0.55);}
  100%{box-shadow:0 0 0 10px rgba(255,159,10,0);}
}
.island-label{
  font-size:13px; font-weight:600; letter-spacing:-0.08px;
  color:rgba(255,255,255,0.9); flex:1;
}
.island-meta{
  font-size:13px; font-weight:600;
  color:#FF453A; font-variant-numeric:tabular-nums;
  letter-spacing:-0.08px;
}
.theme-btn{
  position:absolute; right:18px; top:18px; z-index:31;
  width:36px; height:36px; border-radius:18px;
  background:var(--glass-bg); border:0.5px solid var(--glass-stroke);
  display:flex; align-items:center; justify-content:center;
  color:var(--txt-1); cursor:pointer;
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:inset 0 0.5px 0 var(--glass-shine);
}

/* ─── Hero banner ─── */
.hero{
  position:relative; z-index:1;
  margin:8px 16px 0;
  border-radius:28px;
  background:var(--glass-bg);
  border:0.5px solid var(--glass-stroke);
  box-shadow:
    inset 0 0.5px 0 var(--glass-shine),
    0 18px 50px rgba(0,0,0,0.30);
  backdrop-filter:blur(40px) saturate(180%);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  overflow:hidden;
}
.hero::before{
  content:""; position:absolute; inset:0;
  background:radial-gradient(80% 100% at 100% 0%, rgba(255,69,58,0.22), transparent 70%);
  pointer-events:none;
}
.hero-top{
  position:relative; padding:18px 20px 14px;
  display:flex; align-items:center; gap:16px;
}
.hero-icon{
  width:56px; height:56px; border-radius:18px;
  background:var(--tint-red);
  display:flex; align-items:center; justify-content:center;
  font-size:30px;
  box-shadow:inset 0 0 0 0.5px rgba(255,69,58,0.35);
}
.hero-info{flex:1; min-width:0;}
.hero-label{
  font-size:11px; color:var(--txt-3); font-weight:600;
  letter-spacing:1px; text-transform:uppercase;
  margin-bottom:2px;
}
.hero-name{
  font-size:24px; font-weight:700; letter-spacing:-0.5px;
  display:flex; align-items:center; gap:8px;
}
.hero-conf{
  display:inline-flex; align-items:baseline; gap:3px;
  background:var(--tint-red);
  color:var(--red);
  padding:2px 8px; border-radius:6px;
  border:0.5px solid rgba(255,69,58,0.30);
  font-size:13px; font-weight:600;
  font-variant-numeric:tabular-nums;
}
.hero-eval{
  font-size:13px; color:var(--txt-2);
  margin-top:4px; line-height:1.35;
}

/* score widget inside hero */
.hero-score{
  position:relative;
  padding:14px 20px 18px;
  border-top:0.5px solid var(--sep);
  display:flex; align-items:center; gap:16px;
}
.score-arc{
  position:relative; flex-shrink:0;
  width:88px; height:88px;
}
.score-arc b{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-size:30px; font-weight:700;
  letter-spacing:-1.2px;
  font-variant-numeric:tabular-nums;
  color:var(--txt-1);
}
.score-side{flex:1; min-width:0;}
.score-side .vt{
  font-size:11px; color:var(--txt-3); font-weight:600;
  letter-spacing:0.8px; text-transform:uppercase;
  margin-bottom:3px;
}
.score-side .vv{
  font-size:18px; font-weight:700; color:var(--red);
  letter-spacing:-0.3px;
  margin-bottom:6px;
}
.score-formula{
  font-family:-apple-system,"SF Mono",ui-monospace,monospace;
  font-size:11px; font-variant-numeric:tabular-nums;
  background:rgba(120,120,128,0.18);
  padding:7px 10px; border-radius:8px;
  color:var(--txt-2);
}
.score-formula b{color:var(--txt-1); font-weight:600;}

/* Stat strip */
.stat-strip{
  display:flex; padding:0;
  border-top:0.5px solid var(--sep);
}
.stat-strip > div{
  flex:1; padding:12px 14px;
  display:flex; align-items:baseline; gap:6px;
  border-right:0.5px solid var(--sep);
}
.stat-strip > div:last-child{border-right:none;}
.stat-strip b{
  font-size:20px; font-weight:700;
  letter-spacing:-0.4px;
  font-variant-numeric:tabular-nums;
}
.stat-strip small{
  font-size:11px; color:var(--txt-3); letter-spacing:-0.08px;
}

/* probs row */
.prob-row{
  display:flex; gap:6px;
  padding:12px 18px 16px;
  border-top:0.5px solid var(--sep);
}
.prob-pill{
  flex:1; min-width:0;
  display:flex; flex-direction:column;
  background:rgba(120,120,128,0.14);
  border-radius:10px;
  padding:8px 8px 6px;
  text-align:center;
  gap:4px;
}
.prob-pill .pn{
  font-size:9px; color:var(--txt-3); letter-spacing:0.5px;
  text-transform:uppercase;
}
.prob-pill .pv{
  font-size:14px; font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:-0.3px;
  color:var(--pc);
}
.prob-pill .pb{
  height:3px; border-radius:2px;
  background:rgba(255,255,255,0.06);
  overflow:hidden;
}
.prob-pill .pb > i{
  display:block; height:100%;
  background:var(--pc); box-shadow:0 0 6px var(--pc);
}

/* hard evidence chip */
.ev-row{
  display:none; gap:8px; align-items:center;
  margin:14px 16px 4px;
  padding:10px 12px;
  background:var(--tint-red);
  border:0.5px solid rgba(255,69,58,0.35);
  border-radius:14px;
  position:relative; z-index:1;
}
.ev-row.show{display:flex;}
.ev-row svg{flex-shrink:0; color:var(--red);}
.ev-row .ev-t{
  font-size:11px; font-weight:700;
  text-transform:uppercase; letter-spacing:0.5px;
  color:var(--red);
  margin-right:6px;
}
.ev-row .ev-c{
  flex:1; font-size:13px; color:var(--txt-1);
  font-weight:500;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* ─── Activity timeline ─── */
.section{
  position:relative; z-index:1;
  margin-top:24px; padding:0 16px;
}
.section-h{
  display:flex; align-items:baseline;
  margin:0 4px 12px;
}
.section-h h2{
  font-size:22px; font-weight:700; letter-spacing:-0.45px;
  margin:0; flex:1;
}
.section-h span{
  font-size:13px; color:var(--txt-3); font-variant-numeric:tabular-nums;
}

.tl{position:relative;}
.tl::before{
  content:""; position:absolute;
  left:18px; top:8px; bottom:8px; width:2px;
  background:linear-gradient(to bottom, var(--sep) 0%, var(--sep) 50%, transparent);
  border-radius:1px;
}

.cat{
  position:relative;
  margin-bottom:6px;
  padding-left:42px;
}
.cat-head{
  display:flex; align-items:center; gap:10px;
  padding:6px 0 8px;
  cursor:pointer; user-select:none;
}
.cat-head .marker{
  position:absolute; left:8px;
  width:22px; height:22px; border-radius:11px;
  background:var(--bg-1);
  border:0.5px solid var(--glass-stroke);
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700;
  color:var(--txt-2); font-variant-numeric:tabular-nums;
  z-index:2;
}
.cat-name{
  font-size:15px; font-weight:600; letter-spacing:-0.2px;
  flex:1;
}
.cat-counts{
  display:flex; gap:4px;
  font-size:10px; font-weight:700;
  font-variant-numeric:tabular-nums;
}
.cat-counts span{
  padding:2px 6px; border-radius:5px;
  background:var(--cbg); color:var(--cfg);
  letter-spacing:0;
}
.cat-chev{
  color:var(--txt-4);
  transition:transform .25s ease;
}
.cat.open .cat-chev{transform:rotate(90deg);}

.cat-body{
  max-height:0; overflow:hidden;
  transition:max-height .35s ease;
}
.cat.open .cat-body{max-height:2800px;}

.item{
  display:grid;
  grid-template-columns: 1fr auto;
  column-gap:10px;
  padding:10px 12px;
  background:var(--glass-bg);
  border:0.5px solid var(--glass-stroke);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-radius:14px;
  margin-bottom:6px;
  cursor:pointer;
  position:relative; overflow:hidden;
  box-shadow:inset 0 0.5px 0 var(--glass-shine);
}
.item::before{
  content:""; position:absolute;
  left:0; top:10%; bottom:10%; width:3px;
  background:var(--accent-c);
  border-radius:3px;
}
.item:active{transform:scale(0.99);}
.item-head{
  display:flex; align-items:center; gap:8px;
  min-width:0;
}
.item-name{
  font-size:14px; font-weight:500;
  letter-spacing:-0.16px;
  color:var(--txt-1);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  flex:1; min-width:0;
}
.item-sum{
  grid-column:1; font-size:11px;
  color:var(--txt-3); font-variant-numeric:tabular-nums;
  margin-top:3px; line-height:1.35;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.item-time{
  grid-row:1/3; grid-column:2;
  align-self:start;
  font-size:10px; color:var(--txt-4); font-variant-numeric:tabular-nums;
  letter-spacing:0;
}
.item-badge{
  width:6px; height:6px; border-radius:50%;
  background:var(--accent-c);
  box-shadow:0 0 8px var(--accent-c);
  flex-shrink:0;
}
[data-st="pass"]{--accent-c:var(--green); --cbg:var(--tint-green); --cfg:var(--green);}
[data-st="risk"]{--accent-c:var(--red);   --cbg:var(--tint-red);   --cfg:var(--red);}
[data-st="info"]{--accent-c:var(--info);  --cbg:var(--tint-info);  --cfg:var(--info);}
[data-st="wait"]{--accent-c:var(--txt-4); --cbg:rgba(120,120,128,0.12); --cfg:var(--txt-3);}
[data-ct="pass"]{--cbg:var(--tint-green); --cfg:var(--green);}
[data-ct="risk"]{--cbg:var(--tint-red);   --cfg:var(--red);}
[data-ct="info"]{--cbg:var(--tint-info);  --cfg:var(--info);}

/* ─── Floating dock ─── */
.dock{
  position:fixed; left:16px; right:16px; bottom:18px; z-index:40;
  display:flex; gap:8px;
  padding:6px;
  background:var(--glass-bg);
  border-radius:18px;
  border:0.5px solid var(--glass-stroke);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  box-shadow:
    inset 0 0.6px 0 var(--glass-shine),
    0 16px 40px rgba(0,0,0,0.30);
}
.dock button{
  flex:1; height:44px;
  border-radius:14px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:none;
  font:600 14px/1 -apple-system,system-ui,"PingFang SC",sans-serif;
  letter-spacing:-0.2px;
  color:var(--txt-1);
  background:rgba(120,120,128,0.16);
  cursor:pointer;
}
.dock button:active{transform:scale(0.98);}
.dock button.primary{
  background:var(--accent);
  color:#fff;
  box-shadow:0 6px 18px rgba(94,92,230,0.45), inset 0 0.5px 0 rgba(255,255,255,0.25);
}

/* ─── Sheet ─── */
.sheet-bg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.5);opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px);}
.sheet-bg.show{opacity:1;pointer-events:auto;}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:101;
  background:var(--bg-1);
  border-radius:22px 22px 0 0;
  padding:8px 0 32px;
  transform:translateY(100%);
  transition:transform .35s cubic-bezier(.2,.8,.2,1);
  max-height:78vh;
  display:flex; flex-direction:column;
  box-shadow:0 -20px 60px rgba(0,0,0,0.4);
  border:0.5px solid var(--glass-stroke);
}
.sheet.show{transform:translateY(0);}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--txt-4);margin:6px auto 14px;}
.sheet-head{padding:0 20px 14px; border-bottom:0.5px solid var(--sep);}
.sheet-name{font-size:20px;font-weight:700;letter-spacing:-0.4px;}
.sheet-meta{margin-top:6px;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--txt-3);}
.sheet-body{overflow:auto;padding:14px 20px;font-family:-apple-system,"SF Mono",ui-monospace,monospace;font-size:12px;line-height:1.6;color:var(--txt-2);font-variant-numeric:tabular-nums;}
.sheet-body pre{margin:0;white-space:pre-wrap;word-break:break-all;}
.k{color:var(--info);} .s{color:var(--green);} .n{color:var(--orange);} .b{color:var(--accent);}
.sheet-badge{font-size:10px;font-weight:700;letter-spacing:0.4px;padding:3px 7px;border-radius:6px;text-transform:uppercase;background:var(--cbg);color:var(--cfg);}

main{padding-bottom:120px;}

/* ─── Liquid Glass enhancements ─── */
.hero::after{
  content:""; position:absolute; inset:-40% -20%;
  background:
    radial-gradient(40% 22% at 20% 30%, rgba(255,255,255,0.12), transparent 70%),
    radial-gradient(30% 18% at 80% 60%, rgba(94,92,230,0.10), transparent 70%);
  filter:blur(20px);
  animation:drift 14s ease-in-out infinite alternate;
  pointer-events:none; mix-blend-mode:screen;
}
@keyframes drift{
  0%  { transform:translate(0,0) rotate(0deg); }
  100%{ transform:translate(4%, -3%) rotate(8deg); }
}

#ring{
  animation:ringPulse 3.6s ease-in-out 1.6s 1 forwards;
}
@keyframes ringPulse{
  0%,100%{ filter:drop-shadow(0 0 6px rgba(255,69,58,0.50)); }
  50%    { filter:drop-shadow(0 0 12px rgba(255,69,58,0.85)); }
}

.prob-pill .pb > i{
  width:0 !important;
  animation:probFill 1.1s cubic-bezier(.2,.7,.3,1) .55s forwards;
}
@keyframes probFill{ to{ width:var(--pw,0%) !important; } }

.ev-row{ overflow:hidden; }
.ev-row::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(100deg, transparent 35%, rgba(255,255,255,0.22) 50%, transparent 65%);
  transform:translateX(-100%);
  animation:evScan 3.2s ease-in-out 1.4s 1 forwards;
  pointer-events:none; mix-blend-mode:overlay;
}
@keyframes evScan{
  0%   { transform:translateX(-100%); }
  60%, 100%{ transform:translateX(120%); }
}

.item{
  background:
    linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01)) , var(--glass-bg);
  backdrop-filter:blur(30px) saturate(200%);
  -webkit-backdrop-filter:blur(30px) saturate(200%);
  box-shadow:
    inset 0 0.6px 0 rgba(255,255,255,0.10),
    inset 0 -0.4px 0 rgba(0,0,0,0.18),
    0 6px 18px rgba(0,0,0,0.18);
  transition:transform .15s ease, box-shadow .2s ease;
  opacity:0;
  animation:itemIn .55s cubic-bezier(.2,.7,.3,1) forwards;
}
[data-theme="light"] .item{
  background:
    linear-gradient(180deg, rgba(255,255,255,0.7), rgba(255,255,255,0.35)) , var(--glass-bg);
  box-shadow:
    inset 0 0.6px 0 rgba(255,255,255,0.7),
    0 4px 14px rgba(0,0,0,0.05);
}
@keyframes itemIn{
  from{ opacity:0; transform:translateY(8px) scale(0.985); filter:blur(2px); }
  to  { opacity:1; transform:translateY(0)   scale(1);    filter:blur(0);    }
}
.item[data-st="risk"] .item-badge{
  animation:badgePulse 1.8s ease-in-out 1 forwards;
}
@keyframes badgePulse{
  0%,100%{ box-shadow:0 0 6px var(--accent-c); transform:scale(1); }
  50%    { box-shadow:0 0 14px var(--accent-c); transform:scale(1.25); }
}

<body>

<div class="scan-beam"></div>

<script>
// ==================== 框架 ====================
const checks = [], results = {};
let done = 0, deviceProfile = null, startTime = 0;

function reg(cat, name, fn) { checks.push({ cat, name, fn }); }

function report(name, status, summary, detail) {
  results[name] = { status, summary, detail: detail || {}, ts: Date.now() };
  done++;
  // 更新对应 timeline 项
  const el = document.querySelector(`.item[data-name="${CSS.escape(name)}"]`);
  if (el) {
    el.dataset.st = status;
    const badge = el.querySelector('.item-badge');
    const sum = el.querySelector('.item-sum');
    const time = el.querySelector('.item-time');
    if (sum) sum.textContent = summary;
    if (time) {
      const elapsed = ((performance.now() - startTime) / 1000).toFixed(3);
      time.textContent = '+' + elapsed + 's';
    }
  }
  updateScore();
}

let lastVerdict = null;

function computeFinalVerdict(results, deviceProfile) {
  const v = Object.values(results);
  const passC = v.filter(x=>x.status==='pass').length;
  const riskC = v.filter(x=>x.status==='risk').length;
  const infoC = v.filter(x=>x.status==='info').length;

  // 基础分: 检测通过率 × 设备可信度
  const scored = passC + riskC;
  const checkRate = scored === 0 ? 100 : 100 * passC / scored;
  const emuConf = (deviceProfile?.scores?.['模拟器'] || 0) / 100;
  const cloudConf = (deviceProfile?.scores?.['云真机'] || 0) / 100;
  const riskConf = Math.max(emuConf, cloudConf);
  const rawScore = Math.max(0, Math.min(100, Math.round(checkRate * (1 - riskConf))));

  const profileType = deviceProfile?.type || 'unknown';
  const emuPct = deviceProfile?.scores?.['模拟器'] || 0;
  const cloudPct = deviceProfile?.scores?.['云真机'] || 0;
  const isSafeType = profileType==='iPhone'||profileType==='Android'||profileType==='PC';

  // === Critical Risk 分类 ===
  const criticalRisks = [];
  const hd = results['Headless 深度检测']?.detail;
  if (hd?.critical?.length) hd.critical.forEach(c => criticalRisks.push(c));
  if (results['自动化框架']?.status === 'risk') criticalRisks.push('自动化框架');
  if (results['端口扫描 (WPK)']?.detail?.open?.some(p=>[27042,27043].includes(p))) criticalRisks.push('Frida端口');
  if (results['端口扫描 (WPK)']?.detail?.open?.some(p=>[7125,7126].includes(p))) criticalRisks.push('WPK代理端口');
  if (results['原生函数']?.status === 'risk') criticalRisks.push('原生函数被篡改');

  // === 移动端组合异常 (Android) ===
  let mobileAnomalies = 0;
  if (profileType === 'Android' || (isSafeType && /android/i.test(navigator.userAgent))) {
    if (results['电池状态']?.status === 'risk' || (!navigator.getBattery && /android/i.test(navigator.userAgent))) mobileAnomalies++;
    if (results['传感器']?.status === 'risk') mobileAnomalies++;
    if (results['DeviceMotion']?.status === 'risk') mobileAnomalies++;
    if (results['媒体设备']?.status === 'risk') mobileAnomalies++;
    if (results['Vibration API']?.status === 'risk') mobileAnomalies++;
    const mm = results['matchMedia 特征']?.detail;
    if (mm && mm['hover'] && mm['pointer-fine'] && !mm['pointer-coarse']) mobileAnomalies++;
    if (results['平台 API 三信号']?.status === 'risk') mobileAnomalies++;
    if (results['navigator.plugins']?.status === 'risk') mobileAnomalies++;
    if (results['纹理压缩扩展']?.status === 'risk') mobileAnomalies++;
  }

  // === iOS 伪装异常 ===
  let iosAnomalies = 0;
  if (profileType === 'iPhone' || /iphone|ipad/i.test(navigator.userAgent)) {
    if (!deviceProfile?.signals?.isAppleGPU && deviceProfile?.signals?.gpu) iosAnomalies++;
    if (!!window.chrome) iosAnomalies++;
    const mm = results['matchMedia 特征']?.detail;
    if (mm && mm['hover'] && mm['pointer-fine'] && !mm['pointer-coarse']) iosAnomalies++;
    if (results['DeviceMotion']?.status === 'risk') iosAnomalies++;
  }

  // === 综合 score 上限 ===
  let finalScore = rawScore;
  if (criticalRisks.length >= 3) finalScore = Math.min(finalScore, 15);
  else if (criticalRisks.length >= 2) finalScore = Math.min(finalScore, 30);
  else if (criticalRisks.length >= 1) finalScore = Math.min(finalScore, 49);
  if (mobileAnomalies >= 5) finalScore = Math.min(finalScore, 15);
  else if (mobileAnomalies >= 4) finalScore = Math.min(finalScore, 30);
  else if (mobileAnomalies >= 3) finalScore = Math.min(finalScore, 49);
  if (iosAnomalies >= 2) finalScore = Math.min(finalScore, 49);
  else if (iosAnomalies >= 1 && !deviceProfile?.signals?.isAppleGPU && deviceProfile?.signals?.gpu) finalScore = Math.min(finalScore, 49);
  if (riskC >= 5) finalScore = Math.min(finalScore, 49);
  else if (riskC >= 3) finalScore = Math.min(finalScore, 79);

  // === Verdict ===
  let verdict, verdictColor;
  if (!isSafeType && (emuPct >= 50 || cloudPct >= 50)) {
    verdict = `${profileType} (置信度${Math.max(emuPct,cloudPct)}%)`;
    verdictColor = emuPct>=70||cloudPct>=70 ? 'var(--red)' : 'var(--orange)';
  } else if (criticalRisks.length) {
    verdict = `高风险设备 (${criticalRisks[0]})`;
    verdictColor = 'var(--red)';
  } else if (mobileAnomalies >= 3) {
    verdict = `高风险设备 (${mobileAnomalies}项移动端异常)`;
    verdictColor = 'var(--red)';
  } else if (iosAnomalies >= 2) {
    verdict = `存在风险 (iOS伪装${iosAnomalies}项异常)`;
    verdictColor = 'var(--orange)';
  } else if (finalScore >= 80 && isSafeType && riskC <= 2) {
    verdict = '设备安全';
    verdictColor = 'var(--green)';
  } else if (finalScore >= 50) {
    verdict = '存在风险';
    verdictColor = 'var(--orange)';
  } else {
    verdict = '高风险设备';
    verdictColor = 'var(--red)';
  }

  return { rawScore, finalScore, verdict, verdictColor, passC, riskC, infoC,
    criticalRisks, mobileAnomalies, iosAnomalies, runMode: location.protocol };
}

function getVerdictTone(finalScore, verdict, criticalRisks, mobileAnomalies) {
  if (criticalRisks && criticalRisks.length > 0) return 'risk';
  if (mobileAnomalies && mobileAnomalies >= 3) return 'risk';
  if (finalScore >= 80 && verdict === '设备安全') return 'safe';
  if (finalScore >= 50) return 'warn';
  return 'risk';
}

function updateScore() {
  const v = Object.values(results);
  if (!v.length) return;
  const passC = v.filter(x=>x.status==='pass').length;
  const riskC = v.filter(x=>x.status==='risk').length;
  const infoC = v.filter(x=>x.status==='info').length;
  document.getElementById('sPass').textContent = passC;
  document.getElementById('sRisk').textContent = riskC;
  document.getElementById('sInfo').textContent = infoC;

  // Dynamic Island 更新
  document.getElementById('iLabel').textContent = `检测中... · ${done}/${checks.length} 项`;
  document.getElementById('iMeta').textContent = '';

  // 实时基础分
  const scored = passC + riskC;
  const checkRate = scored === 0 ? 100 : 100 * passC / scored;
  const emuConf = (deviceProfile?.scores?.['模拟器'] || 0) / 100;
  const cloudConf = (deviceProfile?.scores?.['云真机'] || 0) / 100;
  const riskConf = Math.max(emuConf, cloudConf);
  const score = Math.max(0, Math.min(100, Math.round(checkRate * (1 - riskConf))));

  if (done >= checks.length) {
    // 所有检测完成 → 统一最终判定
    lastVerdict = computeFinalVerdict(results, deviceProfile);
    const fs = lastVerdict.finalScore;
    const tone = getVerdictTone(fs, lastVerdict.verdict, lastVerdict.criticalRisks, lastVerdict.mobileAnomalies);

    // 更新 ring
    const ring = document.getElementById('ring');
    ring.style.strokeDashoffset = 226.2 * (1 - fs / 100);
    ring.setAttribute('stroke', 'url(#g-' + tone + ')');

    // 分数动画
    animateScore(fs);

    // Verdict 文本
    const vText = document.getElementById('vText');
    vText.textContent = lastVerdict.verdict;
    vText.style.color = lastVerdict.verdictColor;

    // Formula
    const pRate = (scored === 0 ? 100 : Math.round(100 * passC / scored));
    document.getElementById('scoreFormula').innerHTML =
      `<b>${pRate}%</b> 通过率 × <b>${(1-riskConf).toFixed(2)}</b> 可信度 = <b>${fs}</b>`;

    // Island 完成态
    const dot = document.getElementById('iDot');
    const dotColors = {safe:'var(--green)', warn:'var(--orange)', risk:'var(--red)'};
    dot.style.background = dotColors[tone] || 'var(--red)';
    dot.style.animation = 'none';
    document.getElementById('iLabel').textContent = `检测完成 · ${checks.length} 项`;
    document.getElementById('iMeta').textContent = `分 ${fs}`;
    document.getElementById('iMeta').style.color = lastVerdict.verdictColor;

    // 更新 totalCount
    document.getElementById('totalCount').textContent = `${checks.length} 项 · ${new Date().toLocaleTimeString()}`;

    // 更新 category counts
    updateCatCounts();
  }
}

function animateScore(target) {
  const el = document.getElementById('scoreN');
  el.textContent = '0';
  const dur = 1400, start = performance.now();
  function tick(t) {
    const k = Math.min(1, (t - start) / dur);
    const eased = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(target * eased);
    if (k < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function updateCatCounts() {
  const cats = document.querySelectorAll('.cat[data-cat]');
  cats.forEach(catEl => {
    const catName = catEl.dataset.cat;
    const items = catEl.querySelectorAll('.item');
    const counts = {pass:0, risk:0, info:0};
    items.forEach(it => {
      const st = it.dataset.st;
      if (counts[st] !== undefined) counts[st]++;
    });
    const countsEl = catEl.querySelector('.cat-counts');
    if (countsEl) {
      countsEl.innerHTML = ['risk','pass','info']
        .filter(k => counts[k] > 0)
        .map(k => `<span data-ct="${k}">${counts[k]}</span>`)
        .join('');
    }
  });
}

function renderProfile(p) {
  const icons = {iPhone:'🍎',Android:'📱',PC:'💻','模拟器':'⚠️','云真机':'☁️',unknown:'❓'};
  const tintMap = {iPhone:'--tint-green',Android:'--tint-green',PC:'--tint-blue','模拟器':'--tint-red','云真机':'--tint-orange',unknown:'--tint-blue'};
  const iconEl = document.getElementById('hIcon');
  iconEl.textContent = icons[p.type] || '❓';
  iconEl.style.background = `var(${tintMap[p.type] || '--tint-blue'})`;

  document.getElementById('hName').textContent = p.type;
  document.getElementById('hConf').textContent = p.confidence;

  // One-line eval
  const evalEl = document.getElementById('hEval');
  if (p.hardEvidence && p.hardEvidence.length > 0) {
    evalEl.textContent = '硬证据: ' + p.reason;
  } else {
    evalEl.textContent = Object.entries(p.scores).filter(([,v])=>v>0).map(([k,v])=>`${k} ${v}%`).join(' · ');
  }

  // Confidence pill color
  const confPill = document.querySelector('.hero-conf');
  if (p.type === '模拟器' || p.type === '云真机') {
    confPill.style.background = 'var(--tint-red)';
    confPill.style.color = 'var(--red)';
  } else {
    confPill.style.background = 'var(--tint-green)';
    confPill.style.color = 'var(--green)';
  }

  // Probability bars
  const probColors = {iPhone:'#BF5AF2',Android:'#30D158',PC:'#0A84FF','模拟器':'#FF453A','云真机':'#FF9F0A'};
  const probIcons = {iPhone:'🍎',Android:'📱',PC:'💻','模拟器':'⚠️','云真机':'☁️'};
  const probsEl = document.getElementById('probs');
  probsEl.innerHTML = Object.entries(p.scores)
    .filter(([,v]) => v > 0)
    .sort((a,b) => b[1] - a[1])
    .map(([type, val]) => `
      <div class="prob-pill" style="--pc:${probColors[type]||'#999'}">
        <span class="pn">${probIcons[type]||''} ${type}</span>
        <span class="pv">${val}%</span>
        <span class="pb"><i style="--pw:${val}%"></i></span>
      </div>`).join('');

  // Hard evidence row
  const evRow = document.getElementById('evRow');
  if (p.hardEvidence && p.hardEvidence.length > 0) {
    evRow.classList.add('show');
    document.getElementById('evMain').textContent = p.hardEvidence.join(' · ');
  }
}

function buildUI() {
  const tl = document.getElementById('tl');
  tl.innerHTML = '';
  const catMap = {};
  const catOrder = [];
  checks.forEach(ck => {
    if (!catMap[ck.cat]) { catMap[ck.cat] = []; catOrder.push(ck.cat); }
    catMap[ck.cat].push(ck);
  });

  catOrder.forEach((catName, i) => {
    const items = catMap[catName];
    const open = i < 2 ? 'open' : '';
    const catHtml = `
    <div class="cat ${open}" data-cat="${catName}">
      <div class="cat-head">
        <span class="marker">${String(i+1).padStart(2,'0')}</span>
        <span class="cat-name">${catName}</span>
        <span class="cat-counts"></span>
        <span class="cat-chev"><svg width="8" height="14" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
      <div class="cat-body">
        ${items.map((it, j) => `
          <div class="item" data-st="wait" data-name="${it.name}" style="animation-delay:${(i*60 + j*80 + 200)}ms">
            <div class="item-head"><span class="item-badge"></span><span class="item-name">${it.name}</span></div>
            <div class="item-sum">检测中...</div>
            <div class="item-time"></div>
          </div>`).join('')}
      </div>
    </div>`;
    tl.insertAdjacentHTML('beforeend', catHtml);
  });

  // 事件代理
  tl.addEventListener('click', e => {
    const head = e.target.closest('.cat-head');
    const item = e.target.closest('.item');
    if (head) head.parentElement.classList.toggle('open');
    else if (item && item.dataset.name) openSheet(item.dataset.name);
  });
}

// ─── Sheet ───
function syntaxJson(obj) {
  let s = JSON.stringify(obj, (k,v) => v === Infinity ? '__INF__' : v, 2);
  if (!s) return '';
  s = s.replace(/"__INF__"/g, 'Infinity');
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/("(?:[^"\\]|\\.)*")(\s*:)/g,'<span class="k">$1</span>$2')
    .replace(/:\s*("(?:[^"\\]|\\.)*")/g,': <span class="s">$1</span>')
    .replace(/:\s*(true|false|null)/g,': <span class="b">$1</span>')
    .replace(/:\s*(-?\d+(?:\.\d+)?(?:e[+-]?\d+)?|Infinity)/gi,': <span class="n">$1</span>');
}

function openSheet(name) {
  const r = results[name];
  if (!r) return;

// ==================== 阶段1: 设备画像 ====================

function identifyDevice() {
  const ua = navigator.userAgent, pf = navigator.platform;
  const s = { type: 'unknown', confidence: 0, signals: {}, tags: [] };

  // --- 信号采集 ---
  s.signals.ua = ua;
  s.signals.platform = pf;

  // GPU
  const cv = document.createElement('canvas'), gl = cv.getContext('webgl');
  const dbg = gl?.getExtension('WEBGL_debug_renderer_info');
  s.signals.gpu = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : (gl ? gl.getParameter(gl.RENDERER) : '');
  s.signals.gpuVendor = dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : '';

  // API 存在性
  s.signals.hasBattery = !!navigator.getBattery;
  s.signals.hasConnection = !!navigator.connection;
  s.signals.hasAccelerometer = !!window.Accelerometer;
  s.signals.hasDMPermission = typeof window.DeviceMotionEvent !== 'undefined' && typeof window.DeviceMotionEvent.requestPermission === 'function';
  s.signals.hasChrome = !!window.chrome;
  s.signals.maxTouch = navigator.maxTouchPoints || 0;
  s.signals.cores = navigator.hardwareConcurrency || 0;
  s.signals.memory = navigator.deviceMemory || 0;
  s.signals.isAppleGPU = /apple gpu/i.test(s.signals.gpu);
  s.signals.isMobileGPU = /adreno|mali|powervr|apple gpu/i.test(s.signals.gpu);
  s.signals.isDesktopGPU = /nvidia|geforce|radeon|amd|intel.*(iris|uhd|hd)/i.test(s.signals.gpu);
  s.signals.isSoftGPU = /swiftshader|llvmpipe|softpipe|mesa/i.test(s.signals.gpu);

  // --- 分类逻辑 ---
  let pIPhone=0, pAndroid=0, pPC=0, pEmu=0, pCloud=0;

  // iOS 信号
  if (/iphone|ipad|ipod/i.test(ua) || (pf==='MacIntel' && s.signals.maxTouch>1)) pIPhone+=25;
  if (s.signals.hasDMPermission) pIPhone+=30;
  if (s.signals.isAppleGPU) pIPhone+=25;
  if (!s.signals.hasBattery && !s.signals.hasConnection && !s.signals.hasAccelerometer && /iphone|ipad/i.test(ua)) pIPhone+=15;
  if (s.signals.hasChrome && pIPhone>0) pIPhone-=20;

  // Android 信号
  if (/android/i.test(ua) && /linux arm/i.test(pf)) pAndroid+=25;
  if (s.signals.isMobileGPU && !s.signals.isAppleGPU) pAndroid+=15;
  if (s.signals.hasBattery && s.signals.maxTouch>0 && /android/i.test(ua)) pAndroid+=10;

  // PC 信号
  if (/Win|Mac/.test(pf) && !/android|mobile/i.test(ua) && !(/MacIntel/.test(pf)&&s.signals.maxTouch>1)) pPC+=30;
  if (s.signals.isDesktopGPU) pPC+=20;
  if (s.signals.cores>=8 && s.signals.memory>=8 && !/android|mobile/i.test(ua)) pPC+=10;
  if (/linux/i.test(pf) && !/android/i.test(ua) && !s.signals.isMobileGPU) pPC+=20;

  // 模拟器信号
  if (s.signals.isSoftGPU) pEmu+=35;
  if (/android/i.test(ua) && s.signals.isDesktopGPU) pEmu+=25;
  if (/android/i.test(ua) && /Win/i.test(pf)) pEmu+=30;
  if (s.signals.isMobileGPU && /Win|Mac/.test(pf) && !/MacIntel.*maxTouch/.test('')) pEmu+=15;
  if (/android/i.test(ua) && /i[36]86|x86_64/i.test(pf)) pEmu+=35;
  if (s.signals.isMobileGPU && /i[36]86|x86_64/i.test(pf)) pEmu+=20;
  const chrM = ua.match(/Chrome\/(\d+)/);
  if (chrM && parseInt(chrM[1])<115 && /android/i.test(ua)) pEmu+=15;

  // === 硬证据短路 ===
  s.hardEvidence = [];

  if (/android/i.test(ua) && /i[36]86|x86_64/i.test(pf)) {
    s.hardEvidence.push('x86平台运行Android');
    if (/i686/i.test(pf) && s.signals.cores<=4 && s.signals.memory<=4)
      s.hardEvidence.push('特征匹配:雷电模拟器');
  }

  if (s.signals.isSoftGPU) s.hardEvidence.push('软件渲染GPU(SwiftShader/llvmpipe)');

  if (/android/i.test(ua) && /Win|Mac/.test(pf) && !(/MacIntel/.test(pf)&&s.signals.maxTouch>1))
    s.hardEvidence.push('Android UA但桌面操作系统');

  if (s.signals.isMobileGPU && !s.signals.isAppleGPU && /i[36]86|x86_64/i.test(pf))
    s.hardEvidence.push('ARM GPU通过x86翻译层运行');

  if (s.hardEvidence.length > 0) {
    s.type = '模拟器';
    s.confidence = 100;
    s.scores = {iPhone:0, Android:0, PC:0, '模拟器':100, '云真机':0};
    s.reason = s.hardEvidence.join(' + ');
  } else {
    const scores = {iPhone:pIPhone, Android:pAndroid, PC:pPC, '模拟器':pEmu, '云真机':pCloud};
    const total = Math.max(1, Object.values(scores).reduce((a,b)=>a+b,0));
    const best = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
    s.type = best[0][1]>0 ? best[0][0] : 'unknown';
    s.confidence = Math.round(best[0][1]/total*100);
    s.scores = {};
    for (const [k,v] of Object.entries(scores)) s.scores[k] = Math.round(v/total*100);
    s.reason = '加权评分';
  }

  // 生成标签
  const gpu = s.signals.gpu;
  if (gpu) s.tags.push(gpu.length>30?gpu.substring(0,30)+'...':gpu);
  s.tags.push(pf);
  if (s.signals.cores) s.tags.push(s.signals.cores+'核');
  if (s.signals.memory) s.tags.push(s.signals.memory+'GB');
  s.tags.push('Touch='+s.signals.maxTouch);

  return s;
}

// ==================== 辅助 ====================
function isType(t){return deviceProfile?.type===t}
function isIOS(){return isType('iPhone')}
function isAndroid(){return isType('Android')}
function isPC(){return isType('PC')}
function isEmu(){return isType('模拟器')}
function isMobile(){return isIOS()||isAndroid()}
function isChromeBrowser(){return /chrome/i.test(navigator.userAgent)&&!/edg|opr|opera/i.test(navigator.userAgent)&&!!window.chrome}

reg('环境验证','WebGL 渲染器',async()=>{
  const gpu=deviceProfile.signals.gpu, vendor=deviceProfile.signals.gpuVendor;
  if(!gpu) return report('WebGL 渲染器','info','WebGL 不可用',null);
  const d={vendor,renderer:gpu};
  if(deviceProfile.signals.isSoftGPU) report('WebGL 渲染器','risk',`软件渲染: ${gpu.substring(0,40)} (模拟器)`,d);
  else if(/virtualbox|vmware|vbox/i.test(gpu)) report('WebGL 渲染器','risk',`虚拟机 GPU: ${gpu.substring(0,40)}`,d);
  else report('WebGL 渲染器','pass',gpu.substring(0,50),d);
});

reg('环境验证','GPU vs 平台一致性',async()=>{
  const gpu=deviceProfile.signals.gpu, pf=navigator.platform, ua=navigator.userAgent;
  const d={gpu:gpu?.substring(0,50),platform:pf};
  const issues=[];
  if(/adreno|mali|powervr/i.test(gpu)&&/Win/i.test(pf)) issues.push('手机GPU在Windows');
  if(/adreno|mali|powervr/i.test(gpu)&&/i[36]86|x86_64|x86/i.test(pf)) issues.push('ARM GPU在x86平台 (模拟器)');
  if(deviceProfile.signals.isDesktopGPU&&/android/i.test(ua)&&!/linux/i.test(pf)) issues.push('桌面GPU声称Android');
  if(isIOS()&&!deviceProfile.signals.isAppleGPU&&gpu) issues.push('声称iOS但非Apple GPU');
  if(/android/i.test(ua)&&/i[36]86|x86_64/i.test(pf)) issues.push('Android UA但x86平台 (模拟器)');
  d.issues=issues;
  if(issues.length) report('GPU vs 平台一致性','risk',issues.join('; '),d);
  else report('GPU vs 平台一致性','pass','GPU 与平台匹配',d);
});

reg('环境验证','电池状态',async()=>{
  if(!navigator.getBattery){
    if(isIOS()) return report('电池状态','pass','iOS 不提供 Battery API',{expected:true});
    return report('电池状态','info','Battery API 不可用',null);
  }
  const b=await navigator.getBattery();
  const d={level:b.level,charging:b.charging,chargingTime:b.chargingTime,dischargingTime:b.dischargingTime};
  if(isPC()) return report('电池状态','info',`桌面端 ${Math.round(b.level*100)}% (跳过)`,d);
  if(b.level===1&&b.charging&&b.chargingTime===0) report('电池状态','risk','电量100%+永充+chargingTime=0 (模拟器)',d);
  else report('电池状态','pass',`${Math.round(b.level*100)}% ${b.charging?'充电中':'未充电'}`,d);
});

reg('环境验证','传感器',async()=>{
  if(isPC()) return report('传感器','info','桌面端无需传感器 (跳过)',{skip:true});
  if(isIOS()){
    const has=typeof window.DeviceMotionEvent!=='undefined'&&typeof window.DeviceMotionEvent.requestPermission==='function';
    return report('传感器',has?'pass':'info',has?'iOS DeviceMotion API 可用':'iOS 传感器需用户授权',{iosPermission:has});
  }
  const r={};let miss=0;
  const ck=(n,C)=>new Promise(rv=>{
    try{
      if(!C){r[n]='不存在';miss++;rv();return}
      const s=new C({frequency:10});let got=false;
      s.addEventListener('reading',()=>{if(!got){got=true;r[n]='可用';s.stop();rv()}});
      s.addEventListener('error',()=>{r[n]='错误';miss++;s.stop();rv()});
      s.start();setTimeout(()=>{if(!got){r[n]='超时';miss++;s.stop();rv()}},1500);
    }catch(e){r[n]='异常';miss++;rv()}
  });
  await Promise.all([ck('加速度计',window.Accelerometer),ck('陀螺仪',window.Gyroscope),ck('磁力计',window.Magnetometer)]);
  if(miss>=3&&isMobile()) report('传感器','risk','移动端无传感器 (模拟器特征)',r);
  else if(miss>=3) report('传感器','info','传感器不可用',r);
  else report('传感器','pass',`${3-miss}/3 可用`,r);
});

reg('环境验证','DeviceMotion',async()=>{
  if(isPC()) return report('DeviceMotion','info','桌面端无需运动传感器 (跳过)',{skip:true});
  if(isIOS()&&typeof window.DeviceMotionEvent!=='undefined'&&typeof window.DeviceMotionEvent.requestPermission==='function')
    return report('DeviceMotion','pass','iOS 需用户手势授权 (正常)',{ios:true});
  return new Promise(rv=>{
    let got=false;
    const h=e=>{got=true;window.removeEventListener('devicemotion',h);
      const a=e.accelerationIncludingGravity||{};
      if(a.x===null&&a.y===null&&a.z===null&&isMobile()) report('DeviceMotion','risk','加速度全null (模拟器)',{x:a.x,y:a.y,z:a.z});
      else if(a.x!==null) report('DeviceMotion','pass',`x=${a.x?.toFixed(1)} y=${a.y?.toFixed(1)} z=${a.z?.toFixed(1)}`,{x:a.x,y:a.y,z:a.z});
      else report('DeviceMotion','info','加速度为null',{x:a.x,y:a.y,z:a.z});
      rv();
    };
    window.addEventListener('devicemotion',h);
    setTimeout(()=>{if(!got){window.removeEventListener('devicemotion',h);
      report('DeviceMotion',isMobile()?'risk':'info',isMobile()?'移动端无运动数据 (模拟器)':'无运动数据',null);rv();}},2000);
  });
});

reg('环境验证','硬件信息',async()=>{
  const d={cores:navigator.hardwareConcurrency||0,memory:navigator.deviceMemory||0,
    maxTouch:navigator.maxTouchPoints,platform:navigator.platform};

  else if(isIOS()) msg+=' (iOS不暴露内存)';
  msg+=` Touch=${d.maxTouch}`;

  else report('硬件信息','pass',msg,d);
});

reg('环境验证','屏幕特征',async()=>{
  const d={w:screen.width,h:screen.height,dpr:devicePixelRatio,depth:screen.colorDepth,
    orient:screen.orientation?.type||'unknown'};
  if(d.dpr===1&&d.w>400&&isMobile()&&!isIOS()) report('屏幕特征','info',`DPR=1 宽${d.w}px (移动端少见)`,d);

reg('环境验证','媒体设备',async()=>{
  try{
    if(!navigator.mediaDevices?.enumerateDevices) return report('媒体设备','info','API 不可用',null);
    const devs=await navigator.mediaDevices.enumerateDevices();
    const cam=devs.filter(d=>d.kind==='videoinput').length;
    const mic=devs.filter(d=>d.kind==='audioinput').length;
    const d={cameras:cam,microphones:mic};
    if(cam===0&&mic===0&&isMobile()) report('媒体设备','risk','移动端无摄像头/麦克风',d);
    else report('媒体设备','pass',`摄像头${cam} 麦克风${mic}`,d);

});

reg('环境验证','平台 API 三信号',async()=>{
  const d={};
  d.hasSharedWorker='SharedWorker' in window;
  d.hasOntypechange=!!(navigator.connection&&'ontypechange' in navigator.connection);
  d.hasSinkId=(()=>{try{return 'sinkId' in new Audio()}catch(e){return false}})();
  let mobileSignals=0;
  if(!d.hasSharedWorker) mobileSignals++;
  if(d.hasOntypechange) mobileSignals++;
  if(!d.hasSinkId) mobileSignals++;
  d.mobileSignals=mobileSignals;
  d.claimedMobile=isMobile()||isAndroid();
  if(d.claimedMobile&&mobileSignals<=0)
    report('平台 API 三信号','risk',`声称移动端但0/3移动信号 (桌面环境)`,d);
  else if(d.claimedMobile&&mobileSignals===1)
    report('平台 API 三信号','risk',`仅1/3移动信号 (可疑)`,d);
  else if(!d.claimedMobile&&mobileSignals>=3)
    report('平台 API 三信号','info',`桌面端有3/3移动信号`,d);
  else report('平台 API 三信号','pass',`${mobileSignals}/3 移动信号`,d);
});

reg('环境验证','navigator.plugins',async()=>{
  const plugins=navigator.plugins;
  const list=[];for(let i=0;i<plugins.length;i++)list.push(plugins[i].name);
  const d={count:list.length,list};
  if((isMobile()||isAndroid())&&list.length>0)
    report('navigator.plugins','risk',`移动端有${list.length}个插件: ${list.join(',')} (桌面伪装)`,d);
  else if(isPC()&&list.length===0)
    report('navigator.plugins','info','桌面端无插件',d);
  else report('navigator.plugins','pass',`${list.length}个插件`,d);
});

reg('指纹采集','Canvas 指纹',async()=>{
  const c=document.createElement('canvas');c.width=280;c.height=60;const x=c.getContext('2d');
  x.fillStyle='#f60';x.fillRect(10,1,62,20);x.fillStyle='#069';x.font='14px Arial';
  x.fillText('ACD Fingerprint! 🎮',2,45);x.fillStyle='rgba(102,204,0,.7)';x.fillText('Canvas FP',4,17);
  const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(c.toDataURL()));
  const fp=Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('').substring(0,32);
  report('Canvas 指纹','info',`${fp} (采集)`,{hash:fp});
});

reg('指纹采集','AudioContext 指纹',async()=>{
  try{
    const ac=new(window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,44100,44100);
    const osc=ac.createOscillator();osc.type='triangle';osc.frequency.setValueAtTime(10000,ac.currentTime);
    const comp=ac.createDynamicsCompressor();
    ['threshold','knee','ratio','attack','release'].forEach((p,i)=>comp[p]?.setValueAtTime([-50,40,12,0,.25][i],ac.currentTime));
    osc.connect(comp);comp.connect(ac.destination);osc.start(0);
    const buf=await ac.startRendering();const data=buf.getChannelData(0);
    let sum=0;for(let i=4500;i<5000;i++)sum+=Math.abs(data[i]);
    report('AudioContext 指纹','info','Hash: '+sum.toFixed(8)+' (采集)',{fp:sum.toFixed(10)});
  }catch(e){report('AudioContext 指纹','info','不可用',e.message)}
});

reg('指纹采集','字体指纹',async()=>{
  const fonts=['Arial','Verdana','Times New Roman','Courier New','Georgia','Comic Sans MS','Impact',
    'Microsoft YaHei','SimHei','SimSun','Segoe UI','Calibri','Consolas','Roboto','Droid Sans',
    'Noto Sans CJK','Helvetica Neue','PingFang SC','Ubuntu','DejaVu Sans','Liberation Sans',
    'Menlo','Monaco','SF Pro','Hiragino Sans'];
  const cv=document.createElement('canvas'),ctx=cv.getContext('2d');
  const base='monospace',str='mmMwWLl10!@中文';ctx.font=`72px ${base}`;const bw=ctx.measureText(str).width;
  const avail=[];

  const d={total:fonts.length,available:avail.length,list:avail};
  if(avail.length<=3) report('字体指纹','risk',`仅${avail.length}字体 (Headless?)`,d);
  else report('字体指纹','pass',`${avail.length}/${fonts.length} 字体`,d);
});

reg('指纹采集','UA/Platform 一致性',async()=>{
  const ua=navigator.userAgent,pf=navigator.platform,d={ua:ua.substring(0,80),platform:pf};
  const issues=[];
  if(/android/i.test(ua)&&!/linux/i.test(pf)) issues.push('UA=Android platform≠Linux');

reg('指纹采集','时区与语言',async()=>{

reg('网络与位置','Geolocation',async()=>{

reg('网络与位置','数据中心 IP',async()=>{

reg('工具检测','端口扫描 (WPK)',async()=>{

    ws.onerror=()=>{clearTimeout(t);rv(false)}}catch(e){rv(false)}});
  const ports=[7125,7126,27042,27043,5555,9222,8080,8888];
  const states=await Promise.all(ports.map(async p=>[p,await scan(p)]));
  const open=states.filter(([,ok])=>ok).map(([p])=>p);
  const d={scanned:ports,open};
  const frida=open.some(p=>[27042,27043].includes(p));

reg('工具检测','Headless 深度检测',async()=>{

  if(/Chrome\/\d+/i.test(navigator.userAgent)&&navigator.plugins.length===0&&!isMobile()) issues.push('Chrome UA但plugins为空');

reg('行为分析','触摸事件真实性',async()=>{
  if(!isMobile()&&!isAndroid()) return report('触摸事件真实性','info','非移动端 (跳过)',{skip:true});
  return new Promise(rv=>{
    const samples=[];let reported=false;
    const h=e=>{
      for(let i=0;i<e.touches.length;i++){
        const t=e.touches[i];
        samples.push({force:t.force,rx:t.radiusX,ry:t.radiusY,x:Math.round(t.clientX),y:Math.round(t.clientY)});
      }
      if(samples.length>=3&&!reported){
        reported=true;document.removeEventListener('touchstart',h);document.removeEventListener('touchmove',hm);
        const d={samples:samples.slice(0,10)};
        const allZeroForce=samples.every(s=>s.force===0);
        const allSameRadius=samples.length>1&&samples.every(s=>s.rx===samples[0].rx&&s.ry===samples[0].ry);
        d.allZeroForce=allZeroForce;d.allSameRadius=allSameRadius;
        if(allZeroForce&&allSameRadius)
          report('触摸事件真实性','risk','force=0 + 半径固定 (模拟触摸)',d);
        else if(allZeroForce)
          report('触摸事件真实性','info','force全为0 (部分浏览器正常)',d);
        else report('触摸事件真实性','pass',`force/radius有变化 (真实触摸)`,d);
        rv();
      }
    };
    const hm=e=>{h(e)};
    document.addEventListener('touchstart',h,{passive:true});
    document.addEventListener('touchmove',hm,{passive:true});
    setTimeout(()=>{
      if(!reported){
        reported=true;document.removeEventListener('touchstart',h);document.removeEventListener('touchmove',hm);
        if(samples.length===0) report('触摸事件真实性','info','3秒内无触摸 (需交互)',{timeout:true});
        else{
          const d={samples:samples.slice(0,10),allZeroForce:samples.every(s=>s.force===0),
            allSameRadius:samples.length>1&&samples.every(s=>s.rx===samples[0].rx&&s.ry===samples[0].ry)};
          if(d.allZeroForce&&d.allSameRadius) report('触摸事件真实性','risk','force=0+半径固定',d);
          else report('触摸事件真实性','pass','触摸数据正常',d);
        }
        rv();
      }
    },3000);
  });
});

reg('深度指纹','Math 精度指纹',async()=>{
  const tests={
    acos:Math.acos(0.123456789),atan:Math.atan(2),atan2:Math.atan2(1,2),
    sin:Math.sin(1),cos:Math.cos(1),tan:Math.tan(1),
    exp:Math.exp(1),log:Math.log(2),sqrt:Math.sqrt(2),

  const fp=JSON.stringify(tests);

  const h=Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('').substring(0,16);
  const pf=navigator.platform;

});

reg('深度指纹','WebGL 渲染指纹',async()=>{
  const cv=document.createElement('canvas');cv.width=64;cv.height=64;
  const gl=cv.getContext('webgl');
  if(!gl) return report('WebGL 渲染指纹','info','WebGL 不可用',null);
  const vs=gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs,'attribute vec2 p;varying vec2 v;void main(){v=p;gl_Position=vec4(p,0,1);}');gl.compileShader(vs);
  const fs=gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs,'precision mediump float;varying vec2 v;void main(){gl_FragColor=vec4(v.x*0.5+0.5,v.y*0.5+0.5,sin(v.x*3.14),1);}');gl.compileShader(fs);
  const pg=gl.createProgram();gl.attachShader(pg,vs);gl.attachShader(pg,fs);gl.linkProgram(pg);gl.useProgram(pg);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,0,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pg,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  gl.drawArrays(gl.TRIANGLES,0,3);
  const px=new Uint8Array(64*64*4);gl.readPixels(0,0,64,64,gl.RGBA,gl.UNSIGNED_BYTE,px);
  const hash=await crypto.subtle.digest('SHA-256',px);
  const h=Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('').substring(0,32);
  report('WebGL 渲染指纹','info',`${h} (采集,无基线对比)`,{hash:h});
});

reg('深度指纹','AudioContext 延迟',async()=>{
  try{
    const ac=new AudioContext();
    const d={baseLatency:ac.baseLatency,outputLatency:ac.outputLatency,sampleRate:ac.sampleRate,state:ac.state};
    ac.close();
    if(d.baseLatency===0&&isMobile()) report('AudioContext 延迟','risk','baseLatency=0 (虚拟音频)',d);
    else report('AudioContext 延迟','pass',`延迟${(d.baseLatency*1000).toFixed(1)}ms 采样率${d.sampleRate}`,d);
  }catch(e){report('AudioContext 延迟','info','不可用',e.message)}
});

reg('深度指纹','屏幕物理尺寸',async()=>{
  const w=screen.width,h=screen.height,dpr=devicePixelRatio;
  const pw=w*dpr, ph=h*dpr;
  const physDiag=Math.sqrt(pw*pw+ph*ph);
  const estPPI=isMobile()?420:110;
  const diagInch=physDiag/estPPI;
  const d={width:w,height:h,dpr,physPx:`${Math.round(pw)}x${Math.round(ph)}`,diagInch:diagInch.toFixed(1),estPPI};
  if(isMobile()&&(diagInch<3||diagInch>10)) report('屏幕物理尺寸','info',`~${diagInch.toFixed(1)}寸 (估算, PPI假设${estPPI})`,d);
  else report('屏幕物理尺寸','pass',`~${diagInch.toFixed(1)}寸 ${Math.round(pw)}x${Math.round(ph)}px`,d);
});

reg('深度指纹','Vibration API',async()=>{
  const d={};
  if(!navigator.vibrate) {
    if(isMobile()) report('Vibration API','risk','移动端无振动 API',d);
    else report('Vibration API','pass','桌面端无需振动',d);
    return;
  }
  try{const ok=navigator.vibrate(1);d.result=ok;
    report('Vibration API','pass',`vibrate(1)=${ok}`,d)}
  catch(e){report('Vibration API','info','调用异常',e.message)}
});

reg('深度指纹','Performance 计时',async()=>{
  const iterations=500000;
  const t0=performance.now();
  let x=0;for(let i=0;i<iterations;i++)x+=Math.sin(i)*Math.cos(i);
  const elapsed=performance.now()-t0;
  const d={iterations,elapsedMs:elapsed.toFixed(2),opsPerMs:Math.round(iterations/elapsed),dummy:x};
  report('Performance 计时','info',`${elapsed.toFixed(0)}ms / ${(iterations/1000)}K ops (采集)`,d);
});

reg('深度指纹','平台架构验证',async()=>{
  const pf=navigator.platform, ua=navigator.userAgent, gpu=deviceProfile.signals.gpu||'';
  const d={platform:pf,uaAndroid:/android/i.test(ua),gpu:gpu.substring(0,40)};
  const issues=[];

  if(/android/i.test(ua) && /i[36]86|x86_64/i.test(pf))
    issues.push('x86 平台运行 Android');

  if(/adreno|mali|powervr/i.test(gpu) && /i[36]86|x86_64/i.test(pf))
    issues.push('ARM GPU 在 x86 (翻译层)');

  if(/android/i.test(ua) && /Win|Mac/.test(pf))
    issues.push('Android UA 但桌面平台');

  d.issues=issues;
  if(issues.length) report('平台架构验证','risk',issues.join('; '),d);
  else report('平台架构验证','pass',`${pf} | GPU 匹配`,d);
});

reg('深度指纹','WebGL 扩展数量',async()=>{
  const cv=document.createElement('canvas'),gl=cv.getContext('webgl');
  if(!gl) return report('WebGL 扩展数量','info','不可用',null);
  const exts=gl.getSupportedExtensions()||[];
  const d={count:exts.length,list:exts};
  if(exts.length<8&&isMobile()) report('WebGL 扩展数量','risk',`仅 ${exts.length} 扩展 (软件渲染?)`,d);
  else report('WebGL 扩展数量','pass',`${exts.length} 扩展`,d);
});

reg('深度指纹','纹理压缩扩展',async()=>{
  const cv=document.createElement('canvas'),gl=cv.getContext('webgl');
  if(!gl) return report('纹理压缩扩展','info','WebGL 不可用',null);
  const exts=gl.getSupportedExtensions()||[];
  const desktop=['WEBGL_compressed_texture_s3tc','EXT_texture_compression_bptc','EXT_texture_compression_rgtc',
    'WEBGL_compressed_texture_s3tc_srgb'];
  const mobile=['WEBGL_compressed_texture_etc','WEBGL_compressed_texture_etc1','WEBGL_compressed_texture_astc',
    'WEBGL_compressed_texture_pvrtc'];
  const hasDesktop=desktop.filter(e=>exts.includes(e));
  const hasMobile=mobile.filter(e=>exts.includes(e));
  const d={desktopFormats:hasDesktop,mobileFormats:hasMobile,claimedMobile:isMobile()||isAndroid()};
  if(d.claimedMobile&&hasDesktop.length>0&&hasMobile.length===0)
    report('纹理压缩扩展','risk',`移动端有桌面纹理格式(${hasDesktop.join(',')}) 无移动格式 (模拟器)`,d);
  else if(isPC()&&hasMobile.length>0&&hasDesktop.length===0)
    report('纹理压缩扩展','info',`桌面端有移动纹理格式`,d);
  else report('纹理压缩扩展','pass',`桌面${hasDesktop.length} 移动${hasMobile.length}`,d);
});

reg('深度指纹','时间源精度',async()=>{
  const samples=[];
  for(let i=0;i<50;i++){const a=performance.now(),b=performance.now();if(b>a)samples.push(b-a)}
  const d={sampleCount:samples.length};
  if(samples.length===0){
    d.precision='无差异样本';
    report('时间源精度','pass','精度已被浏览器安全策略限制 (正常)',d);
  }else{
    const min=Math.min(...samples),avg=samples.reduce((a,b)=>a+b,0)/samples.length;
    d.minDelta=min.toFixed(6);d.avgDelta=avg.toFixed(6);
    report('时间源精度','pass',`精度 ${min.toFixed(3)}ms`,d);
  }
});

// ---- 综合判定 ----

reg('综合判定','设备类型概率',async()=>{
  await new Promise(r=>setTimeout(r,500));
  const p=deviceProfile;
  const best=Object.entries(p.scores).sort((a,b)=>b[1]-a[1]);
  const summary=best.filter(([,v])=>v>0).map(([k,v])=>`${k} ${v}%`).join(' | ');
  const top=best[0];
  const safe=top[0]==='iPhone'||top[0]==='Android'||top[0]==='PC';
  report('设备类型概率',safe&&top[1]>=50?'pass':'risk',summary,p.scores);
});

reg('综合判定','云真机判定',async()=>{
  await new Promise(r=>setTimeout(r,500));
  const signals=[];
  if(results['电池状态']?.status==='risk') signals.push('电池异常');
  if(results['数据中心 IP']?.status==='risk') signals.push('数据中心IP');
  if(results['媒体设备']?.status==='risk') signals.push('无媒体设备');
  if(results['传感器']?.status==='risk') signals.push('无传感器');
  if(results['DeviceMotion']?.status==='risk') signals.push('无运动数据');
  const d={signals,count:signals.length};
  if(signals.length>=3) report('云真机判定','risk',`${signals.length}/5: ${signals.join('+')}`,d);
  else if(signals.length>=2) report('云真机判定','info',`${signals.length}/5 信号`,d);
  else report('云真机判定','pass',`${signals.length}/5 信号`,d);
});

// ==================== 启动 ====================
async function run(){
  done=0;lastVerdict=null;Object.keys(results).forEach(k=>delete results[k]);
  startTime = performance.now();

  // 重置 UI
  document.getElementById('scoreN').textContent = '--';
  document.getElementById('vText').textContent = '检测中...';
  document.getElementById('vText').style.color = '';
  document.getElementById('scoreFormula').innerHTML = '';
  document.getElementById('sPass').textContent = '0';
  document.getElementById('sRisk').textContent = '0';
  document.getElementById('sInfo').textContent = '0';
  document.getElementById('iLabel').textContent = '准备检测...';
  document.getElementById('iMeta').textContent = '';
  document.getElementById('evRow').classList.remove('show');
  document.getElementById('totalCount').textContent = '';

  // Ring 重置
  const ring = document.getElementById('ring');
  ring.style.transition = 'none';
  ring.style.strokeDashoffset = '226.2';
  requestAnimationFrame(() => { ring.style.transition = ''; });

  // Island dot 恢复动画
  const dot = document.getElementById('iDot');
  dot.style.background = 'var(--orange)';
  dot.style.animation = '';

  // 阶段1: 设备画像
  deviceProfile = identifyDevice();
  renderProfile(deviceProfile);

  // 阶段2: 针对性检测
  buildUI();
  for(const c of checks){try{await c.fn()}catch(e){report(c.name,'info','异常: '+e.message,e.stack)}}
}
run();
</script>
